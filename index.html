  (function initPWA() {
    const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#f59e0b" rx="100"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="300" font-family="sans-serif" fill="#fff" font-weight="bold">T</text></svg>';
    const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
    const manifest = {
      name: "TitipBekal", short_name: "TitipBekal", display: "standalone",
      start_url: location.href.split('?')[0], background_color: "#ffffff", theme_color: "#f59e0b",
      icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml" }]
    };
    const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}));
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = manifestUrl;
    document.head.appendChild(link);

    const swCode = "self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(clients.claim())); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline Mode'))));";
    const swUrl = URL.createObjectURL(new Blob([swCode], {type: 'application/javascript'}));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl).catch(console.error);
  })();
</script>

const handleImageUpload = (e, callback) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => callback(ev.target.result);
  reader.readAsDataURL(file);
};

// GAS_TEMPLATE: 3 Sheet Utama + Logika Auto-Merge
const GAS_TEMPLATE = `function doPost(e) {
  try {
    var req = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    
    var dbSheet = ss.getSheetByName("DB_Sync");
    if (!dbSheet) {
      dbSheet = ss.insertSheet("DB_Sync");
      dbSheet.hideSheet();
      dbSheet.appendRow(["timestamp", "payload"]);
      dbSheet.appendRow([0, "{}"]);
    }
    
    var cloudTs = Number(dbSheet.getRange(2, 1).getValue()) || 0;
    var cloudDataStr = dbSheet.getRange(2, 2).getValue();
    var cloudData = cloudDataStr ? JSON.parse(cloudDataStr) : {suppliers:[], menus:[], titip:[], ambil:[]};
    
    var today = new Date();
    today.setHours(0,0,0,0);
    var filter3Days = function(arr) {
      return (arr || []).filter(function(x) {
        var d = new Date(x.tanggal); d.setHours(0,0,0,0);
        return Math.floor((today.getTime() - d.getTime()) / (24*60*60*1000)) <= 3;
      });
    };

    if (req.action === "check") {
      if (req.localTs !== cloudTs) return ContentService.createTextOutput(JSON.stringify({ status: "conflict", cloudTs: cloudTs })).setMimeType(ContentService.MimeType.JSON);
      return ContentService.createTextOutput(JSON.stringify({ status: "ok" })).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (req.action === "pull_default") {
      return ContentService.createTextOutput(JSON.stringify({
        status: "success", cloudTs: cloudTs,
        data: { suppliers: cloudData.suppliers || [], menus: cloudData.menus || [], titip: filter3Days(cloudData.titip), ambil: filter3Days(cloudData.ambil) }
      })).setMimeType(ContentService.MimeType.JSON);
    }

    if (req.action === "pull_date") {
      var byDate = function(arr) { return (arr || []).filter(function(x) { return x.tanggal === req.date; }); };
      return ContentService.createTextOutput(JSON.stringify({
        status: "success", data: { titip: byDate(cloudData.titip), ambil: byDate(cloudData.ambil) }
      })).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (req.action === "push") {
      if (req.data.suppliers) cloudData.suppliers = req.data.suppliers;
      if (req.data.menus) cloudData.menus = req.data.menus;
      
      var mergeArray = function(cloudArr, localArr) {
        if(!localArr) return cloudArr;
        localArr.forEach(function(l) {
          var idx = cloudArr.findIndex(function(c) { return c.id === l.id; });
          if (idx > -1) cloudArr[idx] = l; else cloudArr.push(l);
        });
        return cloudArr;
      };
      cloudData.titip = mergeArray(cloudData.titip || [], req.data.titip);
      cloudData.ambil = mergeArray(cloudData.ambil || [], req.data.ambil);
      
      var newTs = new Date().getTime();
      dbSheet.getRange(2, 1).setValue(newTs);
      dbSheet.getRange(2, 2).setValue(JSON.stringify(cloudData));
      
      repopulateReadableSheets(ss, cloudData, newTs);
      return ContentService.createTextOutput(JSON.stringify({ status: "success", cloudTs: newTs })).setMimeType(ContentService.MimeType.JSON);
    }
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function repopulateReadableSheets(ss, data, syncTimeObj) {
  var syncTime = new Date(syncTimeObj);
  
  // 1. Transaksi
  var sheetTx = ss.getSheetByName("Transaksi");
  if (!sheetTx) { sheetTx = ss.insertSheet("Transaksi"); sheetTx.appendRow(["Update Terakhir", "ID", "Tanggal", "Tipe", "Supplier", "Ref Titip", "Detail Menu"]); sheetTx.getRange(1,1,1,7).setFontWeight("bold"); }
  
  // 2. Master Data
  var sheetMaster = ss.getSheetByName("Master Data");
  if (!sheetMaster) { sheetMaster = ss.insertSheet("Master Data"); sheetMaster.appendRow(["Update Terakhir", "Kategori", "ID", "Nama", "Info Tambahan"]); sheetMaster.getRange(1,1,1,5).setFontWeight("bold"); }

  // 3. Log Sync
  var sheetLog = ss.getSheetByName("Log sync");
  if (!sheetLog) { sheetLog = ss.insertSheet("Log sync"); sheetLog.appendRow(["Waktu", "Status Sync", "Keterangan"]); sheetLog.getRange(1,1,1,3).setFontWeight("bold"); }
  sheetLog.appendRow([syncTime, "MERGE / PUSH", "Sinkronisasi berhasil mengupdate Transaksi & Master Data"]);

  if(sheetTx.getLastRow() > 1) sheetTx.getRange(2, 1, sheetTx.getLastRow()-1, sheetTx.getLastColumn()).clearContent();
  if(sheetMaster.getLastRow() > 1) sheetMaster.getRange(2, 1, sheetMaster.getLastRow()-1, sheetMaster.getLastColumn()).clearContent();

  var getSupName = function(id) { var f = (data.suppliers||[]).find(function(s){return s.id===id}); return f ? f.nama : id; };
  var getMenuName = function(id) { var f = (data.menus||[]).find(function(m){return m.id===id}); return f ? f.nama : id; };

  var txRows = [], masterRows = [];
  (data.suppliers||[]).forEach(function(s) { masterRows.push([syncTime, "Supplier", s.id, s.nama, "HP: " + (s.hp||'-') + " | Bank: " + (s.bank||'-') + " " + (s.rekening||'-')]); });
  (data.menus||[]).forEach(function(m) { masterRows.push([syncTime, "Menu", m.id, m.nama, "Kat: " + (m.kategori||'-') + " | Sup: " + getSupName(m.supplierId)]); });
  
  var allTx = [];
  (data.titip||[]).forEach(function(t) { allTx.push({d: new Date(t.tanggal), r: [syncTime, t.id, t.tanggal, "Titip", getSupName(t.supplierId), "-", t.items.map(function(i){return getMenuName(i.menuId)+" ("+i.qty+" pcs)"}).join(", ")]}); });
  (data.ambil||[]).forEach(function(a) { allTx.push({d: new Date(a.tanggal), r: [syncTime, a.id, a.tanggal, "Ambil", getSupName(a.supplierId), a.titipId, a.items.map(function(i){return getMenuName(i.menuId)+" (Sisa:"+i.sisa+",Laku:"+i.terjual+")"}).join(", ")]}); });
  allTx.sort(function(a,b){return b.d-a.d});
  allTx.forEach(function(x){txRows.push(x.r)});

  if (txRows.length > 0) sheetTx.getRange(2, 1, txRows.length, txRows[0].length).setValues(txRows);
  if (masterRows.length > 0) sheetMaster.getRange(2, 1, masterRows.length, masterRows[0].length).setValues(masterRows);
}`;

function Kasir({ menus, hargaJual, notify, executePrint }) {
  const [sales, setSales] = useState(() => LS.get('tb_penjualan', [])); const [cart, setCart] = useState({}); const [q, setQ] = useState(''); const [kat, setKat] = useState(''); const [metode, setMetode] = useState('tunai'); const [bayar, setBayar] = useState(''); const [viewDate, setViewDate] = useState(localDate());
  const cats = useMemo(() => [...new Set(menus.map(m => m.kategori || 'Lainnya'))], [menus]); const list = menus.filter(m => (!kat || (m.kategori || 'Lainnya') === kat) && m.nama.toLowerCase().includes(q.toLowerCase()));
  const lines = menus.filter(m => cart[m.id] > 0).map(m => ({ menuId: m.id, nama: m.nama, qty: cart[m.id], harga: Number(hargaJual)||0 })); const total = lines.reduce((s, l) => s + l.qty * l.harga, 0);
  const bayarNum = metode === 'tunai' ? Math.max(0, Number(bayar)||0) : total; const kembali = bayarNum - total; const canPay = lines.length > 0 && total > 0 && kembali >= 0;
  const setQty = (id, n) => setCart(c => { const x = { ...c }; if (n > 0) x[id] = Math.floor(n); else delete x[id]; return x; });
  const viewSales = sales.filter(s => s.tanggal === viewDate);
  const bayarDanCetak = () => { if (!canPay) return; const t = localDate(); const sale = { id: 'jual-'+Date.now(), no: Math.max(0, ...sales.filter(s => s.tanggal === t).map(s => s.no)) + 1, tanggal: t, waktu: new Date().toISOString(), items: lines, total, bayar: bayarNum, kembali, metode }; const ns = [sale, ...sales]; setSales(ns); LS.set('tb_penjualan', ns); setCart({}); setBayar(''); executePrint({ type: 'kasir', receipt: sale }); notify('Transaksi tersimpan'); };
  return html`

      <div class="card" style=${{ padding:16, display:'flex', flexDirection:'column', gap:10 }}><h3 style=${{ fontSize:15, fontWeight:700 }}>Pilih Menu <span style=${{ fontSize:11, color:'var(--muted)', fontWeight:500 }}>• Rp ${formatRp(hargaJual)}</span></h3><input type="text" class="input-field" placeholder="Cari menu..." value=${q} onInput=${e => setQ(e.target.value)} /><div style=${{ display:'flex', gap:6, flexWrap:'wrap' }}>${['', ...cats].map(c => html`<button class=${c === kat ? 'btn-primary' : 'btn-ghost'} style=${{ padding:'4px 10px', fontSize:12 }} onClick=${() => setKat(c)}>${c || 'Semua'}</button>`)}</div><div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, maxHeight:300, overflowY:'auto' }}>${list.map(m => html`<button key=${m.id} class="btn-ghost" style=${{ flexDirection:'column', alignItems:'flex-start', padding:10, background:'var(--paper2)', position:'relative', textAlign:'left' }} onClick=${() => setQty(m.id, (cart[m.id] || 0) + 1)}><span style=${{ fontSize:13, fontWeight:600, color:'var(--ink)' }}>${m.nama}</span><span style=${{ fontSize:11, color:'var(--muted)' }}>${m.kategori || 'Lainnya'}</span>${cart[m.id] > 0 && html`<span style=${{ position:'absolute', top:6, right:6, background:'var(--accent)', color:'#fff', borderRadius:10, fontSize:11, fontWeight:700, padding:'1px 7px' }}>${cart[m.id]}</span>`}</button>`)}</div></div>
      <div class="card" style=${{ padding:16, display:'flex', flexDirection:'column', gap:10 }}><div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:15, fontWeight:700 }}>Keranjang</h3>${lines.length > 0 && html`<button class="btn-ghost" style=${{ padding:'4px 10px', fontSize:12, color:'var(--expense)' }} onClick=${() => setCart({})}>Kosongkan</button>`}</div>${lines.map(l => html`<div key=${l.menuId} style=${{ display:'flex', alignItems:'center', gap:8, borderBottom:'1px solid var(--border)', paddingBottom:8 }}><div style=${{ flex:1, minWidth:0 }}><div style=${{ fontSize:13, fontWeight:600 }}>${l.nama}</div></div><button class="btn-ghost" style=${{ padding:'2px 10px', fontSize:16 }} onClick=${() => setQty(l.menuId, l.qty - 1)}>−</button><input type="number" min="1" class="input-field" style=${{ width:56, padding:'6px 4px', textAlign:'center' }} value=${l.qty} onInput=${e => setQty(l.menuId, Number(e.target.value))} /><button class="btn-ghost" style=${{ padding:'2px 10px', fontSize:16 }} onClick=${() => setQty(l.menuId, l.qty + 1)}>+</button><div style=${{ width:70, textAlign:'right', fontSize:13, fontWeight:700 }}>${formatRp(l.qty * l.harga)}</div></div>`)}<div style=${{ display:'flex', justifyContent:'space-between', fontSize:18, fontWeight:700 }}><span>Total</span><span>Rp ${formatRp(total)}</span></div><div class="tab-bar" style=${{ width:'100%' }}><button class=${'tab-btn ' + (metode === 'tunai' ? 'active' : '')} onClick=${() => setMetode('tunai')}>Tunai</button><button class=${'tab-btn ' + (metode === 'non' ? 'active' : '')} onClick=${() => setMetode('non')}>Non-tunai</button></div>${metode === 'tunai' && html`<input type="number" min="0" class="input-field" placeholder="Uang diterima (Rp)" value=${bayar} onInput=${e => setBayar(e.target.value)} /><div style=${{ display:'flex', gap:6, flexWrap:'wrap' }}><button class="btn-ghost" style=${{ padding:'4px 10px', fontSize:12 }} onClick=${() => setBayar(String(total))}>Uang Pas</button>${[5000, 10000, 20000, 50000, 100000].map(v => html`<button class="btn-ghost" style=${{ padding:'4px 10px', fontSize:12 }} onClick=${() => setBayar(String(v))}>${formatRp(v)}</button>`)}</div><div style=${{ display:'flex', justifyContent:'space-between', fontSize:14, fontWeight:600, color: kembali < 0 ? 'var(--expense)' : 'var(--success)' }}><span>${kembali < 0 ? 'Kurang' : 'Kembalian'}</span><span>Rp ${formatRp(Math.abs(kembali))}</span></div>`}<button class="btn-primary" disabled=${!canPay} onClick=${bayarDanCetak}><${I.Printer} style=${{ width:16, height:16 }} /> Bayar & Cetak</button></div>

function App() {
  const [dark, setDark] = useState(() => LS.get('tb_theme') === 'dark'); useEffect(() => { document.documentElement.classList.toggle('dark', dark); LS.set('tb_theme', dark ? 'dark' : 'light'); }, [dark]);
  const [activeTab, setActiveTab] = useState('transaksi'); const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null); const toastTimer = useRef(null);
  const notify = useCallback((msg, type = 'ok') => { if(toastTimer.current) clearTimeout(toastTimer.current); setToast({ msg, type }); toastTimer.current = setTimeout(() => setToast(null), 3500); }, []);

  const [suppliers, setSuppliers] = useState(() => LS.get('tb_suppliers', []));
  const [menus, setMenus] = useState(() => LS.get('tb_menus', []));
  const [titip, setTitip] = useState(() => LS.get('tb_titip', []));
  const [ambil, setAmbil] = useState(() => LS.get('tb_ambil', []));
  
  const [syncUrl, setSyncUrl] = useState(() => LS.get('tb_syncUrl', ''));
  const [localTs, setLocalTs] = useState(() => LS.get('tb_localTs', 0));
  const [isSyncing, setIsSyncing] = useState(false);
  
  const defaultSettings = { bizInfo: { nama: 'TitipBekal', alamat: '', telp: '', sosmed: '', logo: '' }, logoMenu: '', hargaJual: 2000, komisi: 200, harianBgColor: '#fef3c7', harianTextColor: '#b45309', harianFontSize: 15 };
  const [settings, setSettings] = useState(() => ({...defaultSettings, ...LS.get('tb_settings', {})}));
  const [kategoriList, setKategoriList] = useState(() => LS.get('tb_kategori', ['Makanan', 'Minuman', 'Kue basah', 'Snack']));
  
  const mergeLocalArray = (localArr, incomingArr) => {
    let newArr = [...localArr];
    incomingArr.forEach(inc => { const idx = newArr.findIndex(l => l.id === inc.id); if (idx > -1) newArr[idx] = inc; else newArr.push(inc); });
    return newArr;
  };

  const applyPullData = (resData, setTs) => {
    if(resData.suppliers) { setSuppliers(resData.suppliers); LS.set('tb_suppliers', resData.suppliers); }
    if(resData.menus) { setMenus(resData.menus); LS.set('tb_menus', resData.menus); }
    if(resData.titip) { const m = mergeLocalArray(titip, resData.titip); setTitip(m); LS.set('tb_titip', m); }
    if(resData.ambil) { const m = mergeLocalArray(ambil, resData.ambil); setAmbil(m); LS.set('tb_ambil', m); }
    if(setTs) { setLocalTs(setTs); LS.set('tb_localTs', setTs); }
  };

  const cloudAction = async (action, reqData = {}) => {
    if(!syncUrl) return null;
    try { const res = await fetch(syncUrl, { method: 'POST', body: JSON.stringify({ action, ...reqData }) }); return await res.json(); } 
    catch(e) { return { status: 'network_error' }; }
  };

  const triggerSync = async (manual = false) => {
    if(!syncUrl || isSyncing) return; setIsSyncing(true);
    const res = await cloudAction('check', { localTs });
    
    if (res.status === 'conflict') {
      setIsSyncing(false);
      if(localTs === 0) {
        setModal({ type: 'conflict_empty', cloudTs: res.cloudTs });
      } else {
        await autoMergeSync();
      }
    } else if (res.status === 'ok') {
      const isDirty = LS.get('tb_dirty', false);
      if (isDirty) await forcePushDelta(manual);
      else { if(manual) notify('Data tersinkronisasi', 'ok'); setIsSyncing(false); }
    } else {
      if(manual) notify('Gagal terhubung ke Cloud', 'err'); setIsSyncing(false);
    }
  };

  const autoMergeSync = async () => {
    const pullRes = await cloudAction('pull_default');
    if (pullRes.status === 'success') {
      applyPullData(pullRes.data, pullRes.cloudTs);
      await forcePushDelta(false); 
      notify('Sinkronisasi otomatis (Merge) berhasil', 'ok');
    }
  };

  const forcePullDefault = async (manual = false) => {
    const res = await cloudAction('pull_default');

            </div>

            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:16 }}>Harga & Komisi (Global)</h3>
            <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:20 }}><div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Harga Jual</label><input type="number" class="input-field" value=${formSet.hargaJual} onInput=${e => setFormSet({...formSet, hargaJual: Number(e.target.value)})} /></div><div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Komisi Lapak</label><input type="number" class="input-field" value=${formSet.komisi} onInput=${e => setFormSet({...formSet, komisi: Number(e.target.value)})} /></div></div>
            <button type="submit" class="btn-primary" style=${{width:'100%', justifyContent:'center'}}>Simpan Pengaturan</button>
          </form>

          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:12 }}>Daftar Kategori Menu</h3>
            <div style=${{ display:'flex', flexDirection:'column', gap:8, marginBottom:12 }}>${kategoriList.map(kat => html`<div style=${{display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid var(--border)'}} key=${kat}><span style=${{fontSize:13, fontWeight:600}}>${kat}</span><button class="btn-ghost" style=${{ padding:4, border:'none', color:'var(--expense)' }} onClick=${()=>{ if(menus.some(m=>m.kategori===kat)) return notify('Kategori dipakai', 'err'); const na = kategoriList.filter(k=>k!==kat); setKategoriList(na); LS.set('tb_kategori', na); }}><${I.Trash} style=${{width:16,height:16}}/></button></div>`)}</div>
            <div style=${{ display:'flex', gap:8 }}><input type="text" class="input-field" placeholder="Kategori Baru" value=${newCat} onInput=${e => setNewCat(e.target.value)} /><button class="btn-primary" onClick=${()=>{const n=newCat.trim(); if(!n||kategoriList.includes(n))return; const na=[...kategoriList, n]; setKategoriList(na); LS.set('tb_kategori', na); setNewCat('');}}>Tambah</button></div>
          </div>
          
          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6, marginBottom:16 }}><${I.Cloud} style=${{width:18,height:18}}/> Cloud Sinkronisasi (Merge Sync)</h3>
            <p style=${{fontSize:12, color:'var(--muted)', marginBottom:12}}>Deploy script di bawah sebagai Web App dan tempel URL-nya untuk sinkronisasi pintar otomatis (Dengan fitur auto-merge dan log sync):</p>
            <textarea class="input-field" rows="8" readOnly style=${{fontFamily:'monospace', fontSize:11, marginBottom:12, background:'var(--ink)', color:'#fff'}} value=${GAS_TEMPLATE} />
            <input type="url" class="input-field" placeholder="https://script.google.com/macros/s/..." value=${syncUrl} onInput=${e => { setSyncUrl(e.target.value); LS.set('tb_syncUrl', e.target.value); }} style=${{ marginBottom:12 }} />
            <button class="btn-ghost" onClick=${() => triggerSync(true)}> ${isSyncing ? 'Mengecek...' : 'Uji Sinkronisasi Sekarang'} </button>
            <div style=${{marginTop:8, fontSize:11, color:'var(--muted)'}}>Status Lokal: ${LS.get('tb_dirty') ? 'Ada perubahan tertunda' : 'Sudah terkirim'}</div>
          </div>
        </div>
      `;
    }
  };

  return html`
    <div>
      <div class="no-print" style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
        <header style=${{ background:'var(--card)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:30, padding:'12px 20px' }}>
          <div style=${{ maxWidth:600, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <h1 style=${{ fontSize:18, fontWeight:700, letterSpacing:'-0.5px', display:'flex', alignItems:'center', gap:6 }}><div style=${{background:'var(--accent)', color:'#fff', width:28, height:28, borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center'}}>T</div>TitipBekal${syncUrl ? html`<span style=${{fontSize:10, padding:'2px 6px', background:'var(--success)', color:'#fff', borderRadius:4, fontWeight:600, letterSpacing:0, marginLeft:4}}>Cloud Aktif</span>` : html`<span style=${{fontSize:10, padding:'2px 6px', background:'var(--expense)', color:'#fff', borderRadius:4, fontWeight:600, letterSpacing:0, marginLeft:4}}>Lokal Saja</span>`}</h1>
            <button onClick=${() => setDark(!dark)} class="btn-ghost" style=${{padding:8, border:'none'}}>${dark ? html`<${I.Sun} style=${{width:18,height:18}} />` : html`<${I.Moon} style=${{width:18,height:18}} />`}</button>
          </div>
        </header>

        <main style=${{ flex:1, maxWidth:600, margin:'0 auto', width:'100%', padding:'20px' }}>
          <div class="tab-bar" style=${{ marginBottom:20, width:'100%', display:'flex' }}>
            <button class=${`tab-btn ${activeTab === 'transaksi' ? 'active' : ''}`} onClick=${() => setActiveTab('transaksi')}>Transaksi</button>
            <button class=${`tab-btn ${activeTab === 'penjualan' ? 'active' : ''}`} onClick=${() => setActiveTab('penjualan')}>Penjualan</button>
            <button class=${`tab-btn ${activeTab === 'master' ? 'active' : ''}`} onClick=${() => setActiveTab('master')}>Master Data</button>
            <button class=${`tab-btn ${activeTab === 'pengaturan' ? 'active' : ''}`} onClick=${() => setActiveTab('pengaturan')}><${I.Settings} style=${{width:16,height:16}}/></button>
          </div>
          ${renderContent()}
        </main>

        <!-- MODAL KONFLIK SINKRONISASI (KHUSUS DATA KOSONG) -->
        ${modal && modal.type === 'conflict_empty' && html`
          <div class="modal-overlay anim-in">
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', background:'var(--info)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>Memulai Aplikasi</h3></div>
              <div style=${{ padding:20 }}>
                <p style=${{ fontSize:14, marginBottom:16 }}>Cloud memiliki data usaha Anda, sedangkan perangkat ini masih kosong. Apakah Anda ingin menarik data Master dan Riwayat?</p>
                <div style=${{ display:'flex', flexDirection:'column', gap:12 }}>
                  <button class="btn-primary" style=${{ background:'var(--ink)', borderColor:'var(--ink)', padding:12 }} onClick=${() => forcePullDefault(true)}>
                    <span style=${{fontSize:14}}>Ya, Tarik Data Cloud</span>
                  </button>
                  <button class="btn-ghost" style=${{ padding:12 }} onClick=${() => setModal(null)}>
                    Nanti Saja
                  </button>
                </div>
              </div>
            </div>
          </div>
        `}

        ${modal === 'supplier' && html`<div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}><div class="modal-box anim-up"><div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${supForm.id.startsWith('sup-') && !suppliers.find(s=>s.id===supForm.id) ? 'Tambah' : 'Edit'} Supplier</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div><form onSubmit=${saveSupplier} style=${{ padding:20, display:'flex', flexDirection:'column', gap:12 }}><input type="text" class="input-field" placeholder="Nama Supplier" required value=${supForm.nama} onInput=${e => setSupForm(f=>({...f, nama:e.target.value}))} /><input type="text" class="input-field" placeholder="No HP/WA" value=${supForm.hp} onInput=${e => setSupForm(f=>({...f, hp:e.target.value}))} /><div style=${{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:12 }}><input type="text" class="input-field" placeholder="Nama Bank" value=${supForm.bank} onInput=${e => setSupForm(f=>({...f, bank:e.target.value}))} /><input type="text" class="input-field" placeholder="No. Rekening" value=${supForm.rekening} onInput=${e => setSupForm(f=>({...f, rekening:e.target.value}))} /></div><textarea class="input-field" placeholder="Alamat" rows="2" value=${supForm.alamat} onInput=${e => setSupForm(f=>({...f, alamat:e.target.value}))} /><button type="submit" class="btn-primary" style=${{ marginTop:8 }}>Simpan</button></form></div></div>`}
        ${modal === 'menu' && html`<div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}><div class="modal-box anim-up"><div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${menuForm.id.startsWith('menu-') && !menus.find(m=>m.id===menuForm.id) ? 'Tambah' : 'Edit'} Menu</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div><form onSubmit=${saveMenu} style=${{ padding:20, display:'flex', flexDirection:'column', gap:12 }}><select class="input-field" required value=${menuForm.supplierId} onChange=${e => setMenuForm(f=>({...f, supplierId:e.target.value}))}><option value="" disabled>Pilih Supplier...</option>${suppliers.map(s => html`<option value=${s.id}>${s.nama}</option>`)}</select><input type="text" class="input-field" placeholder="Nama Menu" required value=${menuForm.nama} onInput=${e => setMenuForm(f=>({...f, nama:e.target.value}))} /><select class="input-field" required value=${menuForm.kategori} onChange=${e => setMenuForm(f=>({...f, kategori:e.target.value}))}><option value="" disabled>Pilih Kategori...</option>${kategoriList.map(k => html`<option value=${k}>${k}</option>`)}</select><button type="submit" class="btn-primary" style=${{ marginTop:8 }}>Simpan</button></form></div></div>`}
        ${modal === 'titip' && html`<div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}><div class="modal-box anim-up"><div style=${{ padding:'16px 20px', background:'var(--accent)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${editingTitipId ? 'Edit Titipan' : 'Catat Titipan Baru'}</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none', color:'#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div><div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}><select class="input-field" value=${titipSup} disabled=${!!editingTitipId} onChange=${e => { setTitipSup(e.target.value); setTitipItems({}); }}><option value="" disabled>1. Pilih Supplier</option>${suppliers.map(s => html`<option value=${s.id}>${s.nama}</option>`)}</select>${titipSup && html`<div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}><div style=${{ fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4 }}>2. Masukkan Qty Menu Titipan</div>${menus.filter(m => m.supplierId === titipSup).map(m => html`<div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}><span style=${{ fontSize:14, flex:1 }}>${m.nama}</span><input type="number" class="input-field" style=${{ width:80, padding:'6px 10px', textAlign:'center' }} placeholder="0" min="0" value=${titipItems[m.id]||''} onInput=${e => setTitipItems({...titipItems, [m.id]: e.target.value})} /></div>`)}</div><button class="btn-primary" onClick=${saveTitip}><${I.Printer} style=${{width:16,height:16}}/> Simpan & Cetak Struk QR Code</button>`}</div></div></div>`}
        ${modal === 'ambil' && html`<div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}><div class="modal-box anim-up"><div style=${{ padding:'16px 20px', background:'var(--ink)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${editingAmbilId ? 'Edit Pengambilan' : 'Proses Ambil'}</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none', color:'#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div><div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}><div style=${{ padding:12, background:'var(--paper2)', borderRadius:8, fontSize:13 }}><div><b>Supplier:</b> ${getSupplierName(ambilSup)}</div><div style=${{color:'var(--muted)', fontSize:11}}>ID: ${ambilRefTitipId}</div></div><div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}><div style=${{ display:'grid', gridTemplateColumns:'1fr 40px 60px 40px', gap:8, fontSize:11, fontWeight:700, color:'var(--muted)', marginBottom:4, textAlign:'center' }}><div style=${{textAlign:'left'}}>Nama Menu</div><div>Ttp</div><div>Sisa</div><div>Laku</div></div>${targetTitipForAmbil.map(t => { const sisa = Number(ambilSisa[t.menuId]) || 0; const terjual = Math.max(0, t.qty - sisa); return html`<div style=${{ display:'grid', gridTemplateColumns:'1fr 40px 60px 40px', gap:8, alignItems:'center', borderBottom:'1px solid var(--border)', paddingBottom:8 }}><span style=${{ fontSize:13, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${getMenuName(t.menuId)}</span><span style=${{ fontSize:13, textAlign:'center' }}>${t.qty}</span><input type="number" class="input-field" style=${{ padding:'4px 6px', textAlign:'center', height:32 }} placeholder="0" min="0" max=${t.qty} value=${ambilSisa[t.menuId]||''} onInput=${e => setAmbilSisa({...ambilSisa, [t.menuId]: e.target.value})} /><span style=${{ fontSize:14, fontWeight:700, textAlign:'center', color: terjual>0?'var(--success)':'var(--muted)' }}>${terjual}</span></div>`; })}</div><button class="btn-primary" style=${{ background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${saveAmbil}><${I.Printer} style=${{width:16,height:16}}/> Simpan & Cetak Rekap</button></div></div></div>`}
        ${modal === 'scan' && html`<div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}><div class="modal-box anim-up"><div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>Scan QR Code Struk</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div><div style=${{ padding:20 }}><div id="qr-reader" style=${{ width: '100%', minHeight: 250, background: '#000', borderRadius: 8 }}></div></div></div></div>`}
        ${modal === 'harian' && html`<div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}><div class="modal-box anim-up"><div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>Cetak Menu Harian</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div><div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}><div><label style=${{ fontSize:12, fontWeight:600, display:'block', marginBottom:4 }}>Tanggal</label><input type="date" class="input-field" value=${harianDate} onInput=${e => setHarianDate(e.target.value)} /></div><div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}><div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}><span style=${{ fontSize:13, fontWeight:600 }}>Pilih Menu:</span><button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11 }} onClick=${() => { const allOn = Object.keys(harianSelected).length === menus.length; const nextSt = {}; if(!allOn) menus.forEach(m => nextSt[m.id] = true); setHarianSelected(nextSt); }}>${Object.keys(harianSelected).length === menus.length ? 'Batal Semua' : 'Pilih Semua'}</button></div>${menus.map(m => html`<label style=${{ display:'flex', alignItems:'center', gap:10, cursor:'pointer', padding:'4px 0' }}><input type="checkbox" style=${{ width:18, height:18, accentColor:'var(--accent)' }} checked=${!!harianSelected[m.id]} onChange=${e => setHarianSelected({...harianSelected, [m.id]: e.target.checked})} /><span style=${{ fontSize:14, fontWeight:500 }}>${m.nama}</span></label>`)}</div><button class="btn-primary" onClick=${cetakHarian}><${I.Printer} style=${{width:16,height:16}}/> Cetak Halaman Warna (PDF)</button></div></div></div>`}
        
        ${toast && html`<${Toast} msg=${toast.msg} type=${toast.type} />`}
      </div>
      <div class="print-only"><${PrintOverlay} printData=${printData} settings=${settings} getSupplierName=${getSupplierName} getMenuName=${getMenuName} /></div>
    </div>
  `;
}
render(html`<${App} />`, document.getElementById('app-root'));
</script>
</body>
</html>
