<script>
  (function initPWA() {
    const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#f59e0b" rx="100"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="300" font-family="sans-serif" fill="#fff" font-weight="bold">T</text></svg>';
    const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
    const manifest = {
      name: "TitipBekal", short_name: "TitipBekal", display: "standalone",
      start_url: location.href.split('?')[0], background_color: "#ffffff", theme_color: "#f59e0b",
      icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml" }]
    };
    const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}));
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = manifestUrl;
    document.head.appendChild(link);

    const swCode = "self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(clients.claim())); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline Mode'))));";
    const swUrl = URL.createObjectURL(new Blob([swCode], {type: 'application/javascript'}));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl).catch(console.error);
  })();
</script>

// Template Google Apps Script lengkap - Diperbarui untuk Two-Way Sync
const GAS_TEMPLATE = `function doPost(e) {
  try {
    var req = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    
    var dbSheet = ss.getSheetByName("DB_Sync");
    if (!dbSheet) {
      dbSheet = ss.insertSheet("DB_Sync");
      dbSheet.hideSheet();
      dbSheet.appendRow(["lastUpdated", "payload"]);
      dbSheet.appendRow([0, "{}"]);
    }
    
    var cloudUpdated = Number(dbSheet.getRange(2, 1).getValue()) || 0;
    var clientUpdated = Number(req.lastUpdated) || 0;
    
    // Perbandingan waktu update
    if (clientUpdated < cloudUpdated) {
      var cloudPayloadStr = dbSheet.getRange(2, 2).getValue();
      var cloudPayload = cloudPayloadStr ? JSON.parse(cloudPayloadStr) : {};
      return ContentService.createTextOutput(JSON.stringify({ status: "pull", lastUpdated: cloudUpdated, payload: cloudPayload })).setMimeType(ContentService.MimeType.JSON);
    } else if (clientUpdated === cloudUpdated) {
      return ContentService.createTextOutput(JSON.stringify({ status: "sync", lastUpdated: cloudUpdated })).setMimeType(ContentService.MimeType.JSON);
    }
    
    // Jika klien lebih update, timpa data Cloud
    var data = req.payload;
    dbSheet.getRange(2, 1).setValue(clientUpdated);
    dbSheet.getRange(2, 2).setValue(JSON.stringify(data));
    
    var getSupName = function(id) {
      if (!data.suppliers) return id;
      for(var i=0; i<data.suppliers.length; i++) {
        if(data.suppliers[i].id === id) return data.suppliers[i].nama;
      }
      return id;
    };
    
    var getMenuName = function(id) {
      if (!data.menus) return id;
      for(var i=0; i<data.menus.length; i++) {
        if(data.menus[i].id === id) return data.menus[i].nama;
      }
      return id;
    };

    var sheetTx = ss.getSheetByName("Transaksi");
    if (!sheetTx) {
      sheetTx = ss.insertSheet("Transaksi");
      sheetTx.appendRow(["Update", "ID", "Tanggal", "Tipe", "Supplier", "Ref Titip", "Detail Menu"]);
      sheetTx.getRange(1,1,1,7).setFontWeight("bold");
    }
    
    var sheetMaster = ss.getSheetByName("Master Data");
    if (!sheetMaster) {
      sheetMaster = ss.insertSheet("Master Data");
      sheetMaster.appendRow(["Update", "Kategori", "ID", "Nama", "Info Tambahan"]);
      sheetMaster.getRange(1,1,1,5).setFontWeight("bold");
    }

    var syncTime = new Date();
    if(sheetTx.getLastRow() > 1) sheetTx.getRange(2, 1, sheetTx.getLastRow()-1, sheetTx.getLastColumn()).clearContent();
    if(sheetMaster.getLastRow() > 1) sheetMaster.getRange(2, 1, sheetMaster.getLastRow()-1, sheetMaster.getLastColumn()).clearContent();

    var txRows = [];
    var masterRows = [];

    if (data.suppliers) {
      data.suppliers.forEach(function(s) {
        masterRows.push([syncTime, "Supplier", s.id, s.nama, "HP: " + (s.hp||'-') + " | Bank: " + (s.bank||'-') + " " + (s.rekening||'-')]);
      });
    }
    if (data.menus) {
      data.menus.forEach(function(m) {
        masterRows.push([syncTime, "Menu", m.id, m.nama, "Kat: " + (m.kategori||'-') + " | Sup: " + getSupName(m.supplierId)]);
      });
    }
    if (data.titip) {
      data.titip.forEach(function(t) {
        var itemsStr = t.items.map(function(i) { return getMenuName(i.menuId) + " (" + i.qty + " pcs)"; }).join(", ");
        txRows.push([syncTime, t.id, t.tanggal, "Titip", getSupName(t.supplierId), "-", itemsStr]);
      });
    }
    if (data.ambil) {
      data.ambil.forEach(function(a) {
        var itemsStr = a.items.map(function(i) { return getMenuName(i.menuId) + " (Sisa: " + i.sisa + ", Laku: " + i.terjual + ")"; }).join(", ");
        txRows.push([syncTime, a.id, a.tanggal, "Ambil", getSupName(a.supplierId), a.titipId, itemsStr]);
      });
    }

    if (txRows.length > 0) sheetTx.getRange(2, 1, txRows.length, txRows[0].length).setValues(txRows);
    if (masterRows.length > 0) sheetMaster.getRange(2, 1, masterRows.length, masterRows[0].length).setValues(masterRows);

    return ContentService.createTextOutput(JSON.stringify({ status: "pushed", lastUpdated: clientUpdated })).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}`;

function Toast({ msg, type }) {
  const isErr = type === 'err';
  return html`
    <div class="toast" style=${{ background: isErr ? 'var(--expense)' : 'var(--ink)' }}>
      ${isErr ? html`<${I.X} style=${{width:14,height:14,flexShrink:0}} />` : html`<${I.Check} style=${{width:14,height:14,flexShrink:0}} />`}
      <span>${msg}</span>
    </div>
  `;
}

function PrintOverlay({ printData, settings, getSupplierName, getMenuName }) {
  useEffect(() => {
    if (printData && (printData.type === 'titip' || printData.type === 'ambil') && window.QRCode) {
      setTimeout(() => {
        const el = document.getElementById("print-qrcode");
        if (el) {
          el.innerHTML = "";
          new QRCode(el, {
            text: printData.id,
            width: 95,
            height: 95,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
          });
        }
      }, 50);
    }
  }, [printData]);
  
  if (!printData) return null;

  const biz = settings.bizInfo;
  const BizHeader = () => html`
    ${biz.logo && html`<div style=${{width:'100%', marginBottom:8}}><img src=${biz.logo} style=${{maxHeight:60, maxWidth:'100%', display:'block', margin:'0 auto'}} /></div>`}
    <h3>${biz.nama || 'TITIP BEKAL'}</h3>
    <div class="biz-info">
      ${biz.alamat && html`<div>${biz.alamat}</div>`}
      ${(biz.telp || biz.sosmed) && html`<div>${biz.telp} ${biz.sosmed ? ' | ' + biz.sosmed : ''}</div>`}
    </div>
    <div class="dashed-line"></div>
  `;

  if (printData.type === 'kasir') {
    return html`<${Struk} receipt=${printData.receipt} bizInfo=${biz} />`;
  }

  if (printData.type === 'titip' || printData.type === 'ambil') {
    const tgl = dateID(printData.tanggal, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const supName = getSupplierName(printData.supplierId);
    let totalLaku = 0, kotor = 0, potKomisi = 0, bersih = 0;
    if(printData.type === 'ambil') {
      const hj = printData.hargaJual || 0;
      const kom = printData.komisi || 0;
      printData.items.forEach(i => totalLaku += i.terjual);
      kotor = totalLaku * hj; potKomisi = totalLaku * kom; bersih = kotor - potKomisi;
    }
    return html`
      <div class="print-struk">
        <${BizHeader} />
        <p style=${{ margin:0, fontSize:12 }}>Tgl: ${tgl}<br/>Sup: ${supName}<br/>Tipe: <b>${printData.type === 'titip' ? 'PENITIPAN' : 'PENGAMBILAN'}</b></p>
        <div id="print-qrcode" style=${{ display: 'flex', justifyContent: 'center', marginTop: 10, marginBottom: 5 }}></div>
        <div class="dashed-line"></div>
        <table>
          <thead><tr style=${{ textAlign:'left', fontSize:11 }}>
            <th>Menu</th><th style=${{ textAlign:'center', width:30 }}>${printData.type === 'titip' ? 'Qty' : 'Ttp'}</th>
            ${printData.type === 'ambil' ? html`<th style=${{ textAlign:'center', width:30 }}>Sisa</th><th style=${{ textAlign:'center', width:30 }}>Laku</th>` : null}
          </tr></thead>
          <tbody>
            ${printData.items.map(item => html`<tr>
              <td style=${{ paddingRight:4 }}>${getMenuName(item.menuId)}</td>
              <td style=${{ textAlign:'center' }}>${printData.type === 'titip' ? item.qty : item.awal}</td>
              ${printData.type === 'ambil' ? html`<td style=${{ textAlign:'center' }}>${item.sisa}</td><td style=${{ textAlign:'center', fontWeight:'bold' }}>${item.terjual}</td>` : null}
            </tr>`)}
          </tbody>
        </table>
        ${printData.type === 'ambil' && html`
          <div class="dashed-line"></div>
          <div style=${{display:'flex', justifyContent:'space-between'}}><span>Laku:</span> <span>${totalLaku} pcs</span></div>
          <div style=${{display:'flex', justifyContent:'space-between'}}><span>Bruto:</span> <span>Rp ${formatRp(kotor)}</span></div>
          <div style=${{display:'flex', justifyContent:'space-between'}}><span>Komisi:</span> <span>-Rp ${formatRp(potKomisi)}</span></div>
          <div class="dashed-line"></div>
          <div style=${{display:'flex', justifyContent:'space-between', fontWeight:'bold', fontSize:13}}><span>Bersih:</span> <span>Rp ${formatRp(bersih)}</span></div>
        `}
        <div class="dashed-line"></div>
        <p style=${{ textAlign:'center', margin:'10px 0 0 0', fontSize:11 }}>Terima Kasih</p>
        <div class="dashed-line" style=${{ marginTop: '8px', marginBottom: '0' }}></div>
        <br/><br/><br/>
      </div>
    `;
  }

  if (printData.type === 'harian') {
    const tgl = dateID(printData.tanggal, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const bg = settings.harianBgColor || '#f9fafb';
    const tc = settings.harianTextColor || '#111827';
    return html`
      <div class="print-a4 print-color-exact" style=${{ background: bg, minHeight: '100vh', padding: '40px', boxSizing: 'border-box' }}>
        <div style=${{ borderBottom: `3px solid ${tc}`, paddingBottom: 20, textAlign: 'center' }}>
          ${biz.logo && html`<img src=${biz.logo} style=${{maxHeight:90, marginBottom:12, display:'block', margin:'0 auto'}} />`}
          <h1 style=${{ color: tc, margin: 0, fontSize: 32 }}>${biz.nama || 'TITIP BEKAL'}</h1>
          <p style=${{ color: tc, margin: '8px 0 0 0', fontSize: 16, opacity: 0.9 }}>${biz.alamat} | Telp: ${biz.telp}</p>
        </div>
        <h2 style=${{textAlign:'center', marginTop:30, marginBottom:30, color: tc, fontSize: 24}}>Daftar Menu Harian<br/><span style=${{fontSize:18, fontWeight:'normal'}}>${tgl}</span></h2>
        <div class="menu-grid">
          ${Object.entries(printData.groupedMenus).map(([kat, menus]) => html`
            <div style=${{ background: 'rgba(255,255,255,0.2)', padding: 16, borderRadius: 12, border: `2px solid ${tc}` }}>
              <div style=${{ borderBottom: `2px solid ${tc}`, color: tc, fontWeight: 'bold', fontSize:18, paddingBottom: 8, marginBottom: 12 }}>
                ${kat || 'Lainnya'}
              </div>
              <div style=${{ display:'flex', flexDirection:'column', gap:10 }}>
                ${menus.map(m => html`
                  <div style=${{ display:'flex', justifyContent:'space-between', borderBottom: `1px dashed ${tc}`, paddingBottom: 6 }}>
                    <span style=${{ fontWeight:600, color: tc, fontSize:15 }}>${m.nama}</span>
                  </div>
                `)}

            </div>
          `)}
        </div>
      </div>

  }

  if (printData.type === 'rekap') {
    const tgl = dateID(printData.tanggal, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return html`
      <div class="print-a4">
        <div style=${{textAlign:'center', marginBottom:20, borderBottom:'2px solid #000', paddingBottom:10}}>

function Struk({ receipt: r, bizInfo }) {
  const biz = bizInfo || {};
  const row = (a, b, bold) => html`<div style=${{ display:'flex', justifyContent:'space-between', fontWeight: bold ? 'bold' : 'normal' }}><span>${a}</span><span>${b}</span></div>`;
  const wkt = new Date(r.waktu).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }).replace('.', ':');
  return html`
    <div class="print-struk">
      ${biz.logo && html`<img src=${biz.logo} style=${{ maxHeight:60, maxWidth:'100%', display:'block', margin:'0 auto 8px' }} />`}
      <h3>${biz.nama || 'TITIP BEKAL'}</h3>
      <div class="biz-info">${biz.alamat && html`<div>${biz.alamat}</div>`}${biz.telp && html`<div>${biz.telp}</div>`}</div>
      <div class="dashed-line"></div>
      ${row('No: #' + pad3(r.no), wkt)}
      <div>${dateID(r.tanggal, { day:'numeric', month:'short', year:'numeric' })}</div>
      <div class="dashed-line"></div>
      ${r.items.map(i => html`<div style=${{ marginBottom:4 }}><div>${i.nama}</div>${row(i.qty + ' x ' + formatRp(i.harga), formatRp(i.qty * i.harga))}</div>`)}
      <div class="dashed-line"></div>
      ${row('Total', 'Rp ' + formatRp(r.total), true)}
      ${row(r.metode === 'tunai' ? 'Tunai' : 'Non-tunai', 'Rp ' + formatRp(r.bayar))}
      ${r.metode === 'tunai' && row('Kembali', 'Rp ' + formatRp(r.kembali))}
      <div class="dashed-line"></div>
      <p style=${{ textAlign:'center', margin:'10px 0 0 0', fontSize:11 }}>Terima Kasih</p>
      <div class="dashed-line" style=${{ marginTop: '8px', marginBottom: '0' }}></div>
      <br/><br/><br/>
    </div>
  `;
}

function Kasir({ menus, hargaJual, bizInfo, notify, executePrint }) {
  const harga = Number(hargaJual) || 0;
  const today = localDate();
  const [sales, setSales] = useState(() => LS.get('tb_penjualan', []));
  const [cart, setCart] = useState({});
  const [q, setQ] = useState('');
  const [kat, setKat] = useState('');
  const [metode, setMetode] = useState('tunai');
  const [bayar, setBayar] = useState('');
  const [viewDate, setViewDate] = useState(today);

  const saveSales = (arr) => { setSales(arr); LS.set('tb_penjualan', arr); };
  const cats = useMemo(() => [...new Set(menus.map(m => m.kategori || 'Lainnya'))], [menus]);
  const list = menus.filter(m => (!kat || (m.kategori || 'Lainnya') === kat) && m.nama.toLowerCase().includes(q.toLowerCase()));
  const lines = menus.filter(m => cart[m.id] > 0).map(m => ({ menuId: m.id, nama: m.nama, qty: cart[m.id], harga }));
  const total = lines.reduce((s, l) => s + l.qty * l.harga, 0);
  
  const bayarNum = metode === 'tunai' ? Math.max(0, (Number(bayar) || 0)) : total;
  const kembali = bayarNum - total;
  const canPay = lines.length > 0 && harga > 0 && kembali >= 0;
  
  const setQty = (id, n) => setCart(c => { const x = { ...c }; if (n > 0) x[id] = Math.floor(n); else delete x[id]; return x; });

  const viewSales = sales.filter(s => s.tanggal === viewDate);
  const omzet = viewSales.reduce((s, x) => s + x.total, 0);
  const viewPcs = viewSales.reduce((s, x) => s + x.items.reduce((a, i) => a + i.qty, 0), 0);

  const cetak = (sale) => { executePrint({ type: 'kasir', receipt: sale }); };

  const bayarDanCetak = () => {
    if (!canPay) return;
    const todays = sales.filter(s => s.tanggal === today);
    const sale = { id: 'jual-' + Date.now(), no: Math.max(0, ...todays.map(s => s.no)) + 1, tanggal: today, waktu: new Date().toISOString(), items: lines, total, bayar: bayarNum, kembali, metode };
    saveSales([sale, ...sales]);
    setCart({}); setBayar('');
    cetak(sale);
    notify('Transaksi tersimpan');
  };
  const hapus = (s) => { if (!confirm('Hapus transaksi #' + pad3(s.no) + '?')) return; saveSales(sales.filter(x => x.id !== s.id)); };

  const lbl = { fontSize:11, color:'var(--muted)' };
  return html`
    <div class="anim-up" style=${{ display:'flex', flexDirection:'column', gap:16 }}>
      <div class="card" style=${{ padding:16 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <h2 style=${{ fontSize:15, fontWeight:700 }}>Ringkasan Penjualan</h2>
          <input type="date" class="input-field" style=${{ width:'auto', padding:'6px 10px' }} value=${viewDate} onInput=${e => setViewDate(e.target.value || today)} />
        </div>
        <div style=${{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, textAlign:'center' }}>
          ${[['Omzet', 'Rp ' + formatRp(omzet)], ['Transaksi', viewSales.length], ['Terjual (pcs)', viewPcs]].map(([a, b]) => html`
            <div style=${{ background:'var(--paper2)', borderRadius:8, padding:'8px 4px' }}><div style=${lbl}>${a}</div><div style=${{ fontSize:15, fontWeight:700 }}>${b}</div></div>`)}
        </div>
      </div>

      <div class="card" style=${{ padding:16, display:'flex', flexDirection:'column', gap:10 }}>
        <h3 style=${{ fontSize:15, fontWeight:700 }}>Pilih Menu <span style=${{ ...lbl, fontWeight:500 }}>• Rp ${formatRp(harga)} / pcs</span></h3>
        ${harga <= 0 && html`<div style=${{ fontSize:12, color:'var(--expense)' }}>Harga jual belum diatur. Isi di Pengaturan → Harga Jual / Pcs.</div>`}
        ${menus.length === 0 && html`<div style=${{ fontSize:13, color:'var(--muted)' }}>Belum ada menu. Tambahkan di Master Data.</div>`}
        <input type="text" class="input-field" placeholder="Cari menu..." value=${q} onInput=${e => setQ(e.target.value)} />
        <div style=${{ display:'flex', gap:6, flexWrap:'wrap' }}>
          ${['', ...cats].map(c => html`<button class=${c === kat ? 'btn-primary' : 'btn-ghost'} style=${{ padding:'4px 10px', fontSize:12 }} onClick=${() => setKat(c)}>${c || 'Semua'}</button>`)}
        </div>
        <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, maxHeight:300, overflowY:'auto' }}>
          ${list.map(m => html`
            <button key=${m.id} class="btn-ghost" style=${{ flexDirection:'column', alignItems:'flex-start', padding:10, background:'var(--paper2)', position:'relative', textAlign:'left' }} onClick=${() => setQty(m.id, (cart[m.id] || 0) + 1)}>
              <span style=${{ fontSize:13, fontWeight:600, color:'var(--ink)' }}>${m.nama}</span>
              <span style=${lbl}>${m.kategori || 'Lainnya'}</span>
              ${cart[m.id] > 0 && html`<span style=${{ position:'absolute', top:6, right:6, background:'var(--accent)', color:'#fff', borderRadius:10, fontSize:11, fontWeight:700, padding:'1px 7px' }}>${cart[m.id]}</span>`}
            </button>`)}
        </div>
      </div>

      <div class="card" style=${{ padding:16, display:'flex', flexDirection:'column', gap:10 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <h3 style=${{ fontSize:15, fontWeight:700 }}>Keranjang</h3>
          ${lines.length > 0 && html`<button class="btn-ghost" style=${{ padding:'4px 10px', fontSize:12, color:'var(--expense)' }} onClick=${() => setCart({})}>Kosongkan</button>`}
        </div>
        ${lines.length === 0 ? html`<div style=${{ fontSize:13, color:'var(--muted)' }}>Ketuk menu di atas untuk menambah.</div>` : lines.map(l => html`
          <div key=${l.menuId} style=${{ display:'flex', alignItems:'center', gap:8, borderBottom:'1px solid var(--border)', paddingBottom:8 }}>
            <div style=${{ flex:1, minWidth:0 }}><div style=${{ fontSize:13, fontWeight:600 }}>${l.nama}</div><div style=${lbl}>Rp ${formatRp(l.harga)}</div></div>
            <button class="btn-ghost" style=${{ padding:'2px 10px', fontSize:16 }} onClick=${() => setQty(l.menuId, l.qty - 1)}>−</button>
            <input type="number" min="1" class="input-field" style=${{ width:56, padding:'6px 4px', textAlign:'center' }} value=${l.qty} onInput=${e => setQty(l.menuId, Number(e.target.value))} />
            <button class="btn-ghost" style=${{ padding:'2px 10px', fontSize:16 }} onClick=${() => setQty(l.menuId, l.qty + 1)}>+</button>
            <div style=${{ width:70, textAlign:'right', fontSize:13, fontWeight:700 }}>${formatRp(l.qty * l.harga)}</div>
          </div>`)}
        <div style=${{ display:'flex', justifyContent:'space-between', fontSize:18, fontWeight:700 }}><span>Total</span><span>Rp ${formatRp(total)}</span></div>
        <div class="tab-bar" style=${{ width:'100%' }}>
          <button class=${'tab-btn ' + (metode === 'tunai' ? 'active' : '')} onClick=${() => setMetode('tunai')}>Tunai</button>
          <button class=${'tab-btn ' + (metode === 'non' ? 'active' : '')} onClick=${() => setMetode('non')}>Non-tunai</button>
        </div>
        ${metode === 'tunai' && html`
          <input type="number" min="0" class="input-field" placeholder="Uang diterima (Rp)" value=${bayar} onInput=${e => setBayar(e.target.value)} />
          <div style=${{ display:'flex', gap:6, flexWrap:'wrap' }}>
            <button class="btn-ghost" style=${{ padding:'4px 10px', fontSize:12 }} onClick=${() => setBayar(String(total))}>Uang Pas</button>
            ${[5000, 10000, 20000, 50000, 100000].map(v => html`<button class="btn-ghost" style=${{ padding:'4px 10px', fontSize:12 }} onClick=${() => setBayar(String(v))}>${formatRp(v)}</button>`)}
          </div>
          <div style=${{ display:'flex', justifyContent:'space-between', fontSize:14, fontWeight:600, color: kembali < 0 ? 'var(--expense)' : 'var(--success)' }}>
            <span>${kembali < 0 ? 'Kurang' : 'Kembalian'}</span><span>Rp ${formatRp(Math.abs(kembali))}</span>
          </div>`}
        <button class="btn-primary" disabled=${!canPay} onClick=${bayarDanCetak}><${I.Printer} style=${{ width:16, height:16 }} /> Bayar & Cetak Struk</button>
      </div>

      <div>
        <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:10 }}>Riwayat Transaksi (${dateID(viewDate, { day:'numeric', month:'short', year:'numeric' })})</h3>
        ${viewSales.length === 0 ? html`<div style=${{ fontSize:13, color:'var(--muted)', textAlign:'center', padding:16 }}>Belum ada transaksi.</div>` : html`
          <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
            ${viewSales.map(s => html`
              <div class="card" key=${s.id} style=${{ padding:12, display:'flex', alignItems:'center', gap:8 }}>
                <div style=${{ flex:1, minWidth:0 }}>
                  <div style=${{ fontSize:14, fontWeight:600 }}>#${pad3(s.no)} • Rp ${formatRp(s.total)}</div>
                  <div style=${{ ...lbl, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${s.items.map(i => i.qty + 'x ' + i.nama).join(', ')}</div>
                </div>
                <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--info)' }} title="Cetak ulang" onClick=${() => cetak(s)}><${I.Printer} style=${{ width:16, height:16 }} /></button>
                <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--expense)' }} title="Hapus" onClick=${() => hapus(s)}><${I.Trash} style=${{ width:16, height:16 }} /></button>
              </div>`)}
          </div>`}
      </div>
    </div>
  `;
}

function App() {
  const [dark, setDark] = useState(() => LS.get('tb_theme') === 'dark');
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); LS.set('tb_theme', dark ? 'dark' : 'light'); }, [dark]);

  const [activeTab, setActiveTab] = useState('transaksi');
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const notify = useCallback((msg, type = 'ok') => {
    if(toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, type });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }, []);

  const [suppliers, setSuppliers] = useState(() => LS.get('tb_suppliers', []));
  const [menus, setMenus] = useState(() => LS.get('tb_menus', []));
  const [titip, setTitip] = useState(() => LS.get('tb_titip', []));
  const [ambil, setAmbil] = useState(() => LS.get('tb_ambil', []));
  const [syncUrl, setSyncUrl] = useState(() => LS.get('tb_syncUrl', ''));
  
  const defaultSettings = { 
    bizInfo: { nama: 'TitipBekal', alamat: '', telp: '', sosmed: '', logo: '' }, 
    hargaJual: 2000, komisi: 200, 
    harianBgColor: '#fef3c7', harianTextColor: '#b45309' 
  };
  const [settings, setSettings] = useState(() => ({...defaultSettings, ...LS.get('tb_settings', {})}));
  const [kategoriList, setKategoriList] = useState(() => LS.get('tb_kategori', ['Makanan', 'Minuman', 'Kue basah', 'Snack']));
  const [searchTx, setSearchTx] = useState('');
  const [searchMaster, setSearchMaster] = useState('');
  const [formSet, setFormSet] = useState(settings);
  const [newCat, setNewCat] = useState('');
  useEffect(() => { if (activeTab === 'pengaturan') setFormSet(settings); }, [activeTab]);

  const SYNC_MAP = { tb_suppliers: 'suppliers', tb_menus: 'menus', tb_titip: 'titip', tb_ambil: 'ambil' };
  
  const syncToCloud = async (manual = false) => {
    if(!syncUrl) { if(manual) notify('Isi URL sinkronisasi dulu', 'err'); return; }
    try {
      const payload = {
        suppliers: LS.get('tb_suppliers', []),
        menus: LS.get('tb_menus', []),
        titip: LS.get('tb_titip', []),
        ambil: LS.get('tb_ambil', [])
      };
      
      let lastUpd = LS.get('tb_lastUpdated', 0);
      if (lastUpd === 0 && (payload.suppliers.length > 0 || payload.menus.length > 0)) {
        lastUpd = Date.now(); LS.set('tb_lastUpdated', lastUpd);
      }
      
      const res = await fetch(syncUrl, { 
        method: 'POST',
        body: JSON.stringify({ lastUpdated: lastUpd, payload }) 
      }).then(r => r.json());
      
      if (res.status === 'pull' && res.payload) {
        LS.set('tb_suppliers', res.payload.suppliers || []); setSuppliers(res.payload.suppliers || []);
        LS.set('tb_menus', res.payload.menus || []); setMenus(res.payload.menus || []);
        LS.set('tb_titip', res.payload.titip || []); setTitip(res.payload.titip || []);
        LS.set('tb_ambil', res.payload.ambil || []); setAmbil(res.payload.ambil || []);
        LS.set('tb_lastUpdated', res.lastUpdated);
        if(manual) notify('Data berhasil ditarik dari Cloud', 'info');
      } else if (res.status === 'pushed' && manual) {
        notify('Cloud berhasil diperbarui');
      } else if (res.status === 'sync' && manual) {
        notify('Data sudah tersinkronisasi (Paling Update)');
      } else if (res.status === 'error' && manual) {
        notify('Error: ' + res.message, 'err');
      }
    } catch(e) { 
      console.warn('Sync error', e); 
      if(manual) notify('Sinkronisasi gagal (Cek URL/Jaringan)', 'err'); 
    }
  };

  useEffect(() => {
    // Jalankan sync background saat aplikasi dibuka (jika URL sudah disetel)
    if (LS.get('tb_syncUrl')) syncToCloud(false);
  }, []);

  const saveState = (key, data, setter) => {
    setter(data); LS.set(key, data);
    LS.set('tb_lastUpdated', Date.now()); // Update timestamp pembaruan lokal
    const f = SYNC_MAP[key];
    if (f) syncToCloud(false); // Dorong perubahan di latar belakang
  };

  const getSupplierName = (id) => { const s = suppliers.find(x => x.id === id); return s ? s.nama : 'Unknown'; };
  const getMenuName = (id) => { const m = menus.find(x => x.id === id); return m ? m.nama : 'Unknown'; };

  const [modal, setModal] = useState(null);
  const todayStr = localDate();
  
  const [txDate, setTxDate] = useState(todayStr);
  const [printData, setPrintData] = useState(null);

  const executePrint = (data) => {
    setPrintData(data);
    setTimeout(() => { window.print(); setModal(null); }, 500);
  };

  // --- HTML5 QR CODE SCANNER EFFECT ---
  useEffect(() => {
    let scanner = null, done = false;
    if (modal === 'scan' && window.Html5QrcodeScanner) {
      setTimeout(() => {
        let config = { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 };
        if (window.Html5QrcodeSupportedFormats) {
          config.formatsToSupport = [ window.Html5QrcodeSupportedFormats.QR_CODE ];
        }
        scanner = new Html5QrcodeScanner("qr-reader", config, false);
        scanner.render((decodedText) => {
          if (done) return; done = true;
          scanner.clear().catch(() => {});
          const foundAmbil = ambil.find(a => a.id === decodedText);
          const foundTitip = titip.find(t => t.id === (foundAmbil ? foundAmbil.titipId : decodedText));
          if(foundTitip) {
            openAmbilModal(foundTitip, foundAmbil || ambil.find(a => a.titipId === foundTitip.id) || null);
          } else {
            setModal(null);
            notify("Data Titip tidak ditemukan untuk struk ini", "err");
          }
        }, (err) => { /* ignore logs */ });
      }, 200);
    }
    return () => { if(scanner) scanner.clear().catch(e=>console.log(e)); }
  }, [modal]);

  const [supForm, setSupForm] = useState({ id: '', nama: '', hp: '', alamat: '', bank: '', rekening: '' });
  const openSupplierModal = (sup = null) => { if (sup) setSupForm({ ...sup }); else setSupForm({ id: 'sup-'+Date.now(), nama: '', hp: '', alamat: '', bank: '', rekening: '' }); setModal('supplier'); };
  const saveSupplier = (e) => { e.preventDefault(); if(!supForm.nama.trim()) return notify('Nama wajib diisi', 'err'); let newSups = [...suppliers]; const idx = newSups.findIndex(s => s.id === supForm.id); if (idx >= 0) newSups[idx] = supForm; else newSups.push(supForm); saveState('tb_suppliers', newSups, setSuppliers); setModal(null); notify('Supplier tersimpan'); };
  const hapusSupplier = (id) => { if(menus.some(m => m.supplierId === id)) return notify('Gagal: Supplier memiliki menu', 'err'); if(titip.some(t => t.supplierId === id)) return notify('Gagal: Supplier punya riwayat titipan', 'err'); if(!confirm('Hapus supplier ini?')) return; saveState('tb_suppliers', suppliers.filter(s => s.id !== id), setSuppliers); };

  const [menuForm, setMenuForm] = useState({ id: '', supplierId: '', nama: '', kategori: kategoriList[0] || '' });
  const openMenuModal = (menu = null) => { if (menu) setMenuForm({ ...menu }); else setMenuForm({ id: 'menu-'+Date.now(), supplierId: suppliers[0]?.id || '', nama: '', kategori: kategoriList[0] || '' }); setModal('menu'); };
  const saveMenu = (e) => { e.preventDefault(); if(!menuForm.nama.trim() || !menuForm.supplierId) return notify('Lengkapi data menu & pilih supplier', 'err'); let newMenus = [...menus]; const idx = newMenus.findIndex(m => m.id === menuForm.id); if (idx >= 0) newMenus[idx] = menuForm; else newMenus.push(menuForm); saveState('tb_menus', newMenus, setMenus); setModal(null); notify('Menu tersimpan'); };
  const hapusMenu = (id) => { if(titip.some(t => t.items.some(i => i.menuId === id))) return notify('Gagal: Menu dipakai di riwayat titipan', 'err'); if(!confirm('Hapus menu ini?')) return; saveState('tb_menus', menus.filter(m => m.id !== id), setMenus); };

  const [harianDate, setHarianDate] = useState(todayStr);
  const [harianSelected, setHarianSelected] = useState({});
  const openHarianModal = () => { setHarianDate(todayStr); setHarianSelected({}); setModal('harian'); };
  const cetakHarian = () => {
    const selectedIds = Object.keys(harianSelected).filter(k => harianSelected[k]);
    if(selectedIds.length === 0) return notify('Pilih minimal 1 menu', 'err');
    const selectedMenus = menus.filter(m => selectedIds.includes(m.id));
    const grouped = {};
    selectedMenus.forEach(m => { const kat = m.kategori || 'Lainnya'; if(!grouped[kat]) grouped[kat] = []; grouped[kat].push(m); });
    executePrint({ type: 'harian', tanggal: harianDate, groupedMenus: grouped });
  };

  const [titipSup, setTitipSup] = useState('');
  const [titipItems, setTitipItems] = useState({});
  const [editingTitipId, setEditingTitipId] = useState(null);
  
  const openTitipModal = (existing = null) => {
    if(existing) {
      setTitipSup(existing.supplierId); setEditingTitipId(existing.id);
      const st = {}; existing.items.forEach(i => { st[i.menuId] = i.qty; });
      setTitipItems(st);
    } else {
      setTitipSup(''); setTitipItems({}); setEditingTitipId(null);
    }
    setModal('titip');
  };
  
  const saveTitip = () => {
    const items = Object.entries(titipItems).filter(([_, qty]) => Number(qty) > 0).map(([menuId, qty]) => ({ menuId, qty: Number(qty) }));
    if(!titipSup) return notify('Pilih supplier dulu', 'err');
    if(items.length === 0) return notify('Masukkan jumlah penitipan minimal 1', 'err');
    if (!editingTitipId) {
      const isDuplicate = titip.find(t => t.tanggal === txDate && t.supplierId === titipSup);
      if (isDuplicate && !confirm(`Peringatan: Supplier sudah menitip barang di tanggal ini. Lanjutkan (kloter kedua)?`)) return;
    }
    else if (ambil.some(a => a.titipId === editingTitipId) && !confirm('Titipan ini sudah diproses pengambilan. Mengubah jumlah tidak mengubah data pengambilan. Lanjutkan?')) return;
    
    const oldT = titip.find(t => t.id === editingTitipId);
    const record = { id: editingTitipId || 'ttp-'+Date.now(), tanggal: oldT ? oldT.tanggal : txDate, supplierId: titipSup, items };
    let newTitip = [...titip];
    if(editingTitipId) { const idx = newTitip.findIndex(t => t.id === editingTitipId); if(idx >= 0) newTitip[idx] = record; } 
    else newTitip.unshift(record);
    saveState('tb_titip', newTitip, setTitip);
    executePrint({ type: 'titip', ...record });
  };

  const [ambilSup, setAmbilSup] = useState('');
  const [ambilRefTitipId, setAmbilRefTitipId] = useState('');
  const [ambilSisa, setAmbilSisa] = useState({});
  const [editingAmbilId, setEditingAmbilId] = useState(null);
  
  const targetTitipForAmbil = useMemo(() => {
    if(!ambilRefTitipId) return [];
    const t = titip.find(x => x.id === ambilRefTitipId);
    return t ? t.items.map(i => ({ menuId: i.menuId, qty: i.qty })) : [];
  }, [titip, ambilRefTitipId]);

  const openAmbilModal = (titipRecord, existingAmbil = null) => {
    setAmbilSup(titipRecord.supplierId); setAmbilRefTitipId(titipRecord.id);
    if(existingAmbil) {
      setEditingAmbilId(existingAmbil.id);
      const st = {}; existingAmbil.items.forEach(i => { st[i.menuId] = i.sisa; });
      setAmbilSisa(st);
    } else { setEditingAmbilId(null); setAmbilSisa({}); }
    setModal('ambil');
  };

  const saveAmbil = () => {
    if(targetTitipForAmbil.length === 0) return notify('Tidak ada referensi titipan', 'err');
    const items = targetTitipForAmbil.map(t => {
      const sisa = Number(ambilSisa[t.menuId]) || 0;
      return { menuId: t.menuId, awal: t.qty, sisa, terjual: Math.max(0, t.qty - sisa) };
    });
    if (targetTitipForAmbil.some(t => (Number(ambilSisa[t.menuId]) || 0) > t.qty || (Number(ambilSisa[t.menuId]) || 0) < 0)) return notify('Sisa tidak valid (melebihi jumlah titip)', 'err');
    if (!editingAmbilId) {
      const isDuplicate = ambil.find(a => a.titipId === ambilRefTitipId);
      if (isDuplicate && !confirm(`Struk Titip ini sudah pernah diproses. Yakin ingin buat baru?`)) return;
    }
    const oldA = ambil.find(a => a.id === editingAmbilId);
    const linkedTitip = titip.find(t => t.id === ambilRefTitipId);
    const recordTanggal = oldA ? oldA.tanggal : (linkedTitip ? linkedTitip.tanggal : txDate);
    const record = { id: editingAmbilId || 'amb-'+Date.now(), titipId: ambilRefTitipId, tanggal: recordTanggal, supplierId: ambilSup, items, hargaJual: oldA ? oldA.hargaJual : settings.hargaJual, komisi: oldA ? oldA.komisi : settings.komisi };
    let newAmbil = [...ambil];
    if(editingAmbilId) { const idx = newAmbil.findIndex(a => a.id === editingAmbilId); if(idx >= 0) newAmbil[idx] = record; } 
    else newAmbil.unshift(record);
    saveState('tb_ambil', newAmbil, setAmbil);
    executePrint({ type: 'ambil', ...record });
  };

  const cetakRekapHarian = () => {
    const rekap = [];
    const txAmbilList = ambil.filter(a => a.tanggal === txDate);
    txAmbilList.forEach(a => a.items.forEach(i => rekap.push({ supplierId: a.supplierId, menuId: i.menuId, awal: i.awal, sisa: i.sisa, terjual: i.terjual })));
    executePrint({ type: 'rekap', tanggal: txDate, rekapList: rekap });
  };

  const renderContent = () => {
    if (activeTab === 'transaksi') {
      const txAmbilList = ambil.filter(a => a.tanggal === txDate);
      const txTitipList = titip.filter(t => t.tanggal === txDate);
      let totalLaku = 0;
      txAmbilList.forEach(a => a.items.forEach(i => totalLaku += i.terjual));
      
      const combinedActs = txTitipList.map(t => {
        const correspondingAmbil = ambil.find(a => a.titipId === t.id);
        return { ...t, _type: 'Titip', isDone: !!correspondingAmbil, relatedAmbil: correspondingAmbil };
      }).sort((a,b) => b.id.localeCompare(a.id, undefined, { numeric: true }));
      
      const filteredActs = searchTx ? combinedActs.filter(act => 
        getSupplierName(act.supplierId).toLowerCase().includes(searchTx.toLowerCase()) || act.id.includes(searchTx)
      ) : combinedActs.slice(0, 15);

      const isAllAmbilDone = combinedActs.length > 0 && combinedActs.every(act => act.isDone);

      return html`
        <div class="anim-up">
          <div class="card" style=${{ padding:20, marginBottom:20, background: dark ? 'var(--card)' : 'linear-gradient(135deg, #10b981 0%, #059669 100%)', color: dark?'inherit':'#fff' }}>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:16 }}>
              <h2 style=${{ fontSize:16, fontWeight:700, margin:0 }}>Ringkasan Penjualan</h2>
              <input type="date" title="Filter Tanggal Transaksi" class="input-field" style=${{ width:'auto', padding:'6px 10px', fontSize:12, background:'var(--card)', color:'var(--ink)', border:'none', borderRadius:8 }} value=${txDate} onInput=${e => setTxDate(e.target.value || todayStr)} />
            </div>
            <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <div><div style=${{ fontSize:12, opacity:0.9 }}>Total Terjual (Pcs)</div><div style=${{ fontSize:28, fontWeight:700 }}>${totalLaku}</div></div>
              <div style=${{ display:'flex', flexDirection:'column', gap:8, borderLeft: dark ? '1px solid var(--border)' : '1px solid rgba(255,255,255,0.3)', paddingLeft:16 }}>
                <div style=${{ fontSize:12 }}><b style=${{fontSize:16}}>${txTitipList.length}</b> Titipan Tercatat</div>
                <div style=${{ fontSize:12 }}><b style=${{fontSize:16}}>${txAmbilList.length}</b> Pengambilan Selesai</div>
              </div>
            </div>
          </div>
          <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
            <button class="btn-primary" style=${{ height:60, flexDirection:'column', gap:2 }} onClick=${()=>openTitipModal()}>
              <${I.Inbox} style=${{width:20,height:20}} /> Buat Titipan Baru
            </button>
            <button class="btn-primary" style=${{ height:60, flexDirection:'column', gap:2, background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${()=>setModal('scan')}>
              <${I.Scan} style=${{width:20,height:20}} /> Scan Struk Ambil
            </button>
          </div>
          <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:24 }}>
            <button class="btn-ghost" style=${{ height:50, background:'var(--card)' }} onClick=${openHarianModal}><${I.Calendar} style=${{width:16,height:16}} /> Menu Harian</button>
            <button class="btn-ghost" style=${{ height:50, background:'var(--card)', color: isAllAmbilDone?'var(--ink)':'var(--muted)' }} disabled=${!isAllAmbilDone} onClick=${cetakRekapHarian}><${I.Printer} style=${{width:16,height:16}} /> Rekap Harian</button>
          </div>
          <div style=${{ position:'relative', marginBottom:12 }}>
            <${I.Search} style=${{ width:16, height:16, position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)' }} />
            <input type="text" class="input-field" style=${{ paddingLeft:36, height:38 }} placeholder="Cari nama atau barcode ID..." value=${searchTx} onInput=${e => setSearchTx(e.target.value)} />
          </div>
          <div style=${{ display:'flex', flexDirection:'column', gap:10 }}>
            ${filteredActs.length === 0 ? html`<div style=${{fontSize:13, color:'var(--muted)', textAlign:'center', padding:20}}>Tidak ditemukan di tanggal ini.</div>` : filteredActs.map(act => html`
              <div class="card" style=${{ padding:12, display:'flex', flexDirection:'column', gap:12 }} key=${act.id}>
                <div style=${{ display:'flex', alignItems:'center', gap:12 }}>
                  <div style=${{ width:36, height:36, borderRadius:8, background:'var(--paper2)', display:'flex', alignItems:'center', justifyContent:'center', color: 'var(--accent)' }}><${I.Inbox} style=${{width:18,height:18}}/></div>
                  <div style=${{ flex:1 }}>
                    <div style=${{ fontSize:14, fontWeight:600 }}>${getSupplierName(act.supplierId)}</div>
                    <div style=${{ fontSize:11, color:'var(--muted)' }}>ID: ${act.id} • ${act.tanggal}</div>
                  </div>
                  <div style=${{ display:'flex', gap:4 }}>
                    <button class="btn-ghost" style=${{ padding:6, border:'none' }} onClick=${() => openTitipModal(act)}><${I.Edit} style=${{width:16,height:16}}/></button>
                    <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--info)' }} onClick=${() => executePrint({ type: 'titip', ...act })}><${I.Printer} style=${{width:16,height:16}}/></button>
                  </div>
                </div>
                <div style=${{ borderTop: '1px dashed var(--border)', paddingTop: 10, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div style=${{ fontSize: 12, fontWeight: 600, color: act.isDone ? 'var(--success)' : 'var(--expense)' }}>
                    ${act.isDone ? 'Status: Selesai Diambil' : 'Status: Belum Diambil'}
                  </div>
                  ${!act.isDone ? html`
                    <button class="btn-primary" style=${{ padding:'6px 12px', fontSize:12, background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${() => openAmbilModal(act)}>Proses Ambil</button>
                  ` : html`
                    <div style=${{ display:'flex', gap:6 }}>
                      <button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11 }} onClick=${() => openAmbilModal(act, act.relatedAmbil)}>Edit Ambil</button>
                      <button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11, color:'var(--info)' }} onClick=${() => executePrint({ type: 'ambil', ...act.relatedAmbil })}>Cetak Rekap</button>
                    </div>
                  `}
                </div>
              </div>
            `)}
          </div>
        </div>
      `;
    }

    if (activeTab === 'penjualan') return html`<${Kasir} menus=${menus} hargaJual=${settings.hargaJual} bizInfo=${settings.bizInfo} notify=${notify} executePrint=${executePrint} />`;

    if (activeTab === 'master') {
      const filteredSups = suppliers.filter(s => s.nama.toLowerCase().includes(searchMaster.toLowerCase()));
      const filteredMenus = menus.filter(m => m.nama.toLowerCase().includes(searchMaster.toLowerCase()) || getSupplierName(m.supplierId).toLowerCase().includes(searchMaster.toLowerCase()));
      return html`
        <div class="anim-up" style=${{ display:'flex', flexDirection:'column', gap:24 }}>
          <div style=${{ position:'relative' }}>
            <${I.Search} style=${{ width:16, height:16, position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)' }} />
            <input type="text" class="input-field" style=${{ paddingLeft:36, height:38 }} placeholder="Cari supplier atau menu..." value=${searchMaster} onInput=${e => setSearchMaster(e.target.value)} />
          </div>
          <div>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
              <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6 }}><${I.Users} style=${{width:16,height:16}}/> Data Supplier</h3>
              <button class="btn-ghost" style=${{ padding:'6px 12px', fontSize:12 }} onClick=${()=>openSupplierModal()}><${I.Plus} style=${{width:14,height:14}}/> Tambah</button>
            </div>
            ${filteredSups.length === 0 ? html`<div style=${{fontSize:13, color:'var(--muted)'}}>Tidak ditemukan.</div>` : html`
              <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
                ${filteredSups.map(s => html`
                  <div class="card" style=${{ padding:12, display:'flex', flexDirection:'column', gap:8 }} key=${s.id}>
                    <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                      <div style=${{ flex:1, paddingRight:8 }}>
                        <div style=${{ fontSize:14, fontWeight:600 }}>${s.nama}</div>
                        <div style=${{ fontSize:12, color:'var(--muted)', marginTop:2 }}>${s.alamat || '-'} | ${s.hp || '-'} | Bank: ${s.bank || '-'}</div>
                      </div>
                      <div style=${{ display:'flex', gap:4 }}>
                        ${s.rekening && html`<button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--info)' }} title="Salin Rekening" onClick=${() => { navigator.clipboard.writeText(s.rekening).then(()=>notify('Rekening disalin')); }}><${I.Copy} style=${{width:16,height:16}}/></button>`}
                        ${s.hp && html`<a href="https://wa.me/${formatWA(s.hp)}" target="_blank" class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--success)' }} title="WhatsApp"><${I.MessageCircle} style=${{width:16,height:16}}/></a>`}
                        <button class="btn-ghost" style=${{ padding:6, border:'none' }} onClick=${()=>openSupplierModal(s)}><${I.Edit} style=${{width:16,height:16}}/></button>
                        <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--expense)' }} onClick=${()=>hapusSupplier(s.id)}><${I.Trash} style=${{width:16,height:16}}/></button>
                      </div>
                    </div>
                  </div>
                `)}
              </div>
            `}
          </div>
          <div>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
              <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6 }}><${I.Coffee} style=${{width:16,height:16}}/> Data Menu</h3>
              <button class="btn-ghost" style=${{ padding:'6px 12px', fontSize:12 }} onClick=${()=>openMenuModal()}><${I.Plus} style=${{width:14,height:14}}/> Tambah</button>
            </div>
            ${filteredMenus.length === 0 ? html`<div style=${{fontSize:13, color:'var(--muted)'}}>Tidak ditemukan.</div>` : html`
              <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
                ${filteredMenus.map(m => html`
                  <div class="card list-row" style=${{padding:12, display:'flex', justifyContent:'space-between'}} key=${m.id}>
                    <div>
                      <div style=${{ fontSize:14, fontWeight:600 }}>${m.nama}</div>
                      <div style=${{ fontSize:12, color:'var(--muted)' }}>${m.kategori} • Sup: ${getSupplierName(m.supplierId)}</div>
                    </div>
                    <div style=${{ display:'flex', gap:4 }}>
                      <button class="btn-ghost" style=${{ padding:6, border:'none' }} onClick=${()=>openMenuModal(m)}><${I.Edit} style=${{width:16,height:16}}/></button>
                      <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--expense)' }} onClick=${()=>hapusMenu(m.id)}><${I.Trash} style=${{width:16,height:16}}/></button>
                    </div>
                  </div>
                `)}
              </div>
            `}
          </div>
        </div>
      `;
    }

    if (activeTab === 'pengaturan') {
      const simpanPengaturan = (e) => { e.preventDefault(); saveState('tb_settings', formSet, setSettings); notify('Pengaturan Disimpan'); };
      const handleLogoUpload = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, logo: ev.target.result}}); reader.readAsDataURL(file); };
      const addKategori = () => { const nm = newCat.trim(); if(!nm) return; if(kategoriList.includes(nm)) return notify('Kategori sudah ada', 'err'); const newArr = [...kategoriList, nm]; setKategoriList(newArr); LS.set('tb_kategori', newArr); setNewCat(''); notify('Kategori ditambah'); };
      const hapusKategori = (kat) => { if(menus.some(m => m.kategori === kat)) return notify('Kategori digunakan pada menu', 'err'); const newArr = kategoriList.filter(k => k !== kat); setKategoriList(newArr); LS.set('tb_kategori', newArr); };

      return html`
        <div class="anim-up card" style=${{ padding:20, display:'flex', flexDirection:'column', gap:24 }}>
          <form onSubmit=${simpanPengaturan}>
            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:16 }}>Profil Usaha (Kop Struk)</h3>
            <div style=${{ display:'flex', flexDirection:'column', gap:12, marginBottom:20 }}>
              <div>
                <label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Logo Usaha</label>
                <div style=${{display:'flex', gap:10, alignItems:'center'}}>
                  ${formSet.bizInfo.logo && html`<img src=${formSet.bizInfo.logo} style=${{height:40, width:40, objectFit:'contain', borderRadius:4, border:'1px solid var(--border)'}} />`}
                  <input type="file" accept="image/*" class="input-field" onChange=${handleLogoUpload} style=${{flex:1, padding:6}} />
                  ${formSet.bizInfo.logo && html`<button type="button" class="btn-ghost" style=${{color:'var(--expense)', padding:6}} onClick=${()=>setFormSet({...formSet, bizInfo: {...formSet.bizInfo, logo:''}})}><${I.Trash} style=${{width:16,height:16}}/></button>`}
                </div>
              </div>
              <input type="text" class="input-field" placeholder="Nama Usaha" value=${formSet.bizInfo.nama} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, nama: e.target.value}})} />
              <textarea class="input-field" placeholder="Alamat" rows="2" value=${formSet.bizInfo.alamat} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, alamat: e.target.value}})} />
              <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <input type="text" class="input-field" placeholder="No. Telpon" value=${formSet.bizInfo.telp} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, telp: e.target.value}})} />
                <input type="text" class="input-field" placeholder="Sosmed (IG/FB)" value=${formSet.bizInfo.sosmed} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, sosmed: e.target.value}})} />
              </div>
            </div>

            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:16 }}>Harga & Komisi (Global)</h3>
            <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:20 }}>
              <div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Harga Jual / Pcs (Rp)</label><input type="number" class="input-field" value=${formSet.hargaJual} onInput=${e => setFormSet({...formSet, hargaJual: Number(e.target.value)})} /></div>
              <div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Komisi Lapak (Rp)</label><input type="number" class="input-field" value=${formSet.komisi} onInput=${e => setFormSet({...formSet, komisi: Number(e.target.value)})} /></div>
            </div>

            <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20, marginBottom:20 }}>
              <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:12 }}>Format Cetak Menu Harian</h3>
              <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Warna Latar Belakang</label><input type="color" class="input-field" style=${{height:44, padding:4}} value=${formSet.harianBgColor} onInput=${e => setFormSet({...formSet, harianBgColor: e.target.value})} /></div>
                <div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Warna Teks & Garis</label><input type="color" class="input-field" style=${{height:44, padding:4}} value=${formSet.harianTextColor} onInput=${e => setFormSet({...formSet, harianTextColor: e.target.value})} /></div>
              </div>
            </div>

            <button type="submit" class="btn-primary" style=${{width:'100%', justifyContent:'center'}}>Simpan Pengaturan</button>
          </form>

          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:12 }}>Daftar Kategori Menu</h3>
            <div style=${{ display:'flex', flexDirection:'column', gap:8, marginBottom:12 }}>
              ${kategoriList.map(kat => html`<div style=${{display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid var(--border)'}} key=${kat}><span style=${{fontSize:13, fontWeight:600}}>${kat}</span><button class="btn-ghost" style=${{ padding:4, border:'none', color:'var(--expense)' }} onClick=${()=>hapusKategori(kat)}><${I.Trash} style=${{width:16,height:16}}/></button></div>`)}
            </div>
            <div style=${{ display:'flex', gap:8 }}><input type="text" class="input-field" placeholder="Nama Kategori Baru" value=${newCat} onInput=${e => setNewCat(e.target.value)} /><button class="btn-primary" onClick=${addKategori}>Tambah</button></div>
          </div>
          
          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6, marginBottom:16 }}><${I.Cloud} style=${{width:18,height:18}}/> Cloud Sinkronisasi</h3>
            <p style=${{fontSize:12, color:'var(--muted)', marginBottom:12}}>1. Buat Google Apps Script baru dan salin kode ini untuk fungsi tarik-dorong otomatis berdasarkan yang paling update (Two-Way Sync):</p>
            <textarea class="input-field" rows="18" readOnly style=${{fontFamily:'monospace', fontSize:11, marginBottom:12, background:'var(--ink)', color:'#fff'}} value=${GAS_TEMPLATE} />
            <p style=${{fontSize:12, color:'var(--muted)', marginBottom:12}}>2. Lakukan <b>Deploy as Web App</b> (Who has access: Anyone), lalu salin dan tempel Web App URL-nya ke bawah ini:</p>
            <input type="url" class="input-field" placeholder="https://script.google.com/macros/s/..." value=${syncUrl} onInput=${e => { setSyncUrl(e.target.value); LS.set('tb_syncUrl', e.target.value); }} style=${{ marginBottom:12 }} />
            <button class="btn-ghost" onClick=${() => syncToCloud(true)}>Uji Sinkronisasi Sekarang</button>
          </div>
        </div>
      `;
    }
  };

  return html`
    <div>
      <div class="no-print" style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
        <header style=${{ background:'var(--card)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:30, padding:'12px 20px' }}>
          <div style=${{ maxWidth:600, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <h1 style=${{ fontSize:18, fontWeight:700, letterSpacing:'-0.5px', display:'flex', alignItems:'center', gap:6 }}>
              <div style=${{background:'var(--accent)', color:'#fff', width:28, height:28, borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center'}}>T</div>
              TitipBekal
              ${syncUrl ? html`<span style=${{fontSize:10, padding:'2px 6px', background:'var(--success)', color:'#fff', borderRadius:4, fontWeight:600, letterSpacing:0, marginLeft:4}} title="Data dicadangkan di Cloud">Cloud Aktif</span>` : html`<span style=${{fontSize:10, padding:'2px 6px', background:'var(--expense)', color:'#fff', borderRadius:4, fontWeight:600, letterSpacing:0, marginLeft:4}} title="Data hanya tersimpan di perangkat ini">Lokal Saja</span>`}
            </h1>
            <button onClick=${() => setDark(!dark)} class="btn-ghost" style=${{padding:8, border:'none'}}>${dark ? html`<${I.Sun} style=${{width:18,height:18}} />` : html`<${I.Moon} style=${{width:18,height:18}} />`}</button>
          </div>
        </header>

        <main style=${{ flex:1, maxWidth:600, margin:'0 auto', width:'100%', padding:'20px' }}>
          <div class="tab-bar" style=${{ marginBottom:20, width:'100%', display:'flex' }}>
            <button class=${`tab-btn ${activeTab === 'transaksi' ? 'active' : ''}`} onClick=${() => setActiveTab('transaksi')}>Transaksi</button>
            <button class=${`tab-btn ${activeTab === 'penjualan' ? 'active' : ''}`} onClick=${() => setActiveTab('penjualan')}>Penjualan</button>
            <button class=${`tab-btn ${activeTab === 'master' ? 'active' : ''}`} onClick=${() => setActiveTab('master')}>Master Data</button>
            <button class=${`tab-btn ${activeTab === 'pengaturan' ? 'active' : ''}`} onClick=${() => setActiveTab('pengaturan')}><${I.Settings} style=${{width:16,height:16}}/></button>
          </div>
          ${renderContent()}
        </main>

        <!-- MODALS -->
        ${modal === 'supplier' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${supForm.id.startsWith('sup-') && !suppliers.find(s=>s.id===supForm.id) ? 'Tambah' : 'Edit'} Supplier</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div>
              <form onSubmit=${saveSupplier} style=${{ padding:20, display:'flex', flexDirection:'column', gap:12 }}>
                <input type="text" class="input-field" placeholder="Nama Supplier" required value=${supForm.nama} onInput=${e => setSupForm(f=>({...f, nama:e.target.value}))} />
                <input type="text" class="input-field" placeholder="No HP/WA (Mulai dengan 08 / 628)" value=${supForm.hp} onInput=${e => setSupForm(f=>({...f, hp:e.target.value}))} />
                <div style=${{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:12 }}><input type="text" class="input-field" placeholder="Nama Bank" value=${supForm.bank} onInput=${e => setSupForm(f=>({...f, bank:e.target.value}))} /><input type="text" class="input-field" placeholder="No. Rekening" value=${supForm.rekening} onInput=${e => setSupForm(f=>({...f, rekening:e.target.value}))} /></div>
                <textarea class="input-field" placeholder="Alamat (opsional)" rows="2" value=${supForm.alamat} onInput=${e => setSupForm(f=>({...f, alamat:e.target.value}))} />
                <button type="submit" class="btn-primary" style=${{ marginTop:8 }}>Simpan</button>
              </form>
            </div>
          </div>
        `}

        ${modal === 'menu' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${menuForm.id.startsWith('menu-') && !menus.find(m=>m.id===menuForm.id) ? 'Tambah' : 'Edit'} Menu</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div>
              <form onSubmit=${saveMenu} style=${{ padding:20, display:'flex', flexDirection:'column', gap:12 }}>
                <select class="input-field" required value=${menuForm.supplierId} onChange=${e => setMenuForm(f=>({...f, supplierId:e.target.value}))}>
                  <option value="" disabled>Pilih Supplier...</option>${suppliers.map(s => html`<option value=${s.id}>${s.nama}</option>`)}
                </select>
                <input type="text" class="input-field" placeholder="Nama Menu" required value=${menuForm.nama} onInput=${e => setMenuForm(f=>({...f, nama:e.target.value}))} />
                <select class="input-field" required value=${menuForm.kategori} onChange=${e => setMenuForm(f=>({...f, kategori:e.target.value}))}>
                  <option value="" disabled>Pilih Kategori...</option>${kategoriList.map(k => html`<option value=${k}>${k}</option>`)}
                </select>
                <button type="submit" class="btn-primary" style=${{ marginTop:8 }}>Simpan</button>
              </form>
            </div>
          </div>
        `}

        ${modal === 'titip' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', background:'var(--accent)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${editingTitipId ? 'Edit Titipan' : 'Catat Titipan Baru'}</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none', color:'#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div>
              <div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
                <select class="input-field" value=${titipSup} disabled=${!!editingTitipId} onChange=${e => { setTitipSup(e.target.value); setTitipItems({}); }}>
                  <option value="" disabled>1. Pilih Supplier</option>${suppliers.map(s => html`<option value=${s.id}>${s.nama}</option>`)}
                </select>
                ${titipSup && html`
                  <div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}>
                    <div style=${{ fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4 }}>2. Masukkan Qty Menu Titipan</div>
                    ${menus.filter(m => m.supplierId === titipSup).map(m => html`
                      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
                        <span style=${{ fontSize:14, flex:1 }}>${m.nama}</span>
                        <input type="number" class="input-field" style=${{ width:80, padding:'6px 10px', textAlign:'center' }} placeholder="0" min="0" value=${titipItems[m.id]||''} onInput=${e => setTitipItems({...titipItems, [m.id]: e.target.value})} />
                      </div>
                    `)}
                  </div>
                  <button class="btn-primary" onClick=${saveTitip}><${I.Printer} style=${{width:16,height:16}}/> Simpan & Cetak Struk QR Code</button>
                `}
              </div>
            </div>
          </div>
        `}

        ${modal === 'ambil' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', background:'var(--ink)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>${editingAmbilId ? 'Edit Pengambilan' : 'Proses Ambil (Rekap Laku)'}</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none', color:'#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div>
              <div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
                <div style=${{ padding:12, background:'var(--paper2)', borderRadius:8, fontSize:13 }}><div><b>Supplier:</b> ${getSupplierName(ambilSup)}</div><div style=${{color:'var(--muted)', fontSize:11}}>ID Referensi: ${ambilRefTitipId}</div></div>
                <div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}>
                  <div style=${{ display:'grid', gridTemplateColumns:'1fr 40px 60px 40px', gap:8, fontSize:11, fontWeight:700, color:'var(--muted)', marginBottom:4, textAlign:'center' }}>
                    <div style=${{textAlign:'left'}}>Nama Menu</div><div>Ttp</div><div>Sisa</div><div>Laku</div>
                  </div>
                  ${targetTitipForAmbil.map(t => {
                    const sisa = Number(ambilSisa[t.menuId]) || 0;
                    const terjual = Math.max(0, t.qty - sisa);
                    return html`
                      <div style=${{ display:'grid', gridTemplateColumns:'1fr 40px 60px 40px', gap:8, alignItems:'center', borderBottom:'1px solid var(--border)', paddingBottom:8 }}>
                        <span style=${{ fontSize:13, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${getMenuName(t.menuId)}</span>
                        <span style=${{ fontSize:13, textAlign:'center' }}>${t.qty}</span>
                        <input type="number" class="input-field" style=${{ padding:'4px 6px', textAlign:'center', height:32 }} placeholder="0" min="0" max=${t.qty} value=${ambilSisa[t.menuId]||''} onInput=${e => setAmbilSisa({...ambilSisa, [t.menuId]: e.target.value})} />
                        <span style=${{ fontSize:14, fontWeight:700, textAlign:'center', color: terjual>0?'var(--success)':'var(--muted)' }}>${terjual}</span>
                      </div>
                    `;
                  })}
                </div>
                <button class="btn-primary" style=${{ background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${saveAmbil}><${I.Printer} style=${{width:16,height:16}}/> Simpan & Cetak Rekap</button>
              </div>
            </div>
          </div>
        `}

        ${modal === 'scan' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>Scan QR Code Struk</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div>
              <div style=${{ padding:20 }}><p style=${{ fontSize:13, color:'var(--muted)', marginBottom:12, textAlign:'center' }}>Arahkan kamera ke QR Code pada struk titipan untuk memproses pengambilan.</p><div id="qr-reader" style=${{ width: '100%', minHeight: 250, background: '#000', borderRadius: 8 }}></div></div>
            </div>
          </div>
        `}

        ${modal === 'harian' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}><h3 style=${{ fontSize:16, fontWeight:700 }}>Cetak Menu Harian</h3><button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button></div>
              <div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
                <div><label style=${{ fontSize:12, fontWeight:600, display:'block', marginBottom:4 }}>Tanggal</label><input type="date" class="input-field" value=${harianDate} onInput=${e => setHarianDate(e.target.value)} /></div>
                <div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}>
                  <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}><span style=${{ fontSize:13, fontWeight:600 }}>Pilih Menu:</span><button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11 }} onClick=${() => { const allOn = Object.keys(harianSelected).length === menus.length; const nextSt = {}; if(!allOn) menus.forEach(m => nextSt[m.id] = true); setHarianSelected(nextSt); }}>${Object.keys(harianSelected).length === menus.length ? 'Batal Semua' : 'Pilih Semua'}</button></div>
                  ${menus.map(m => html`
                    <label style=${{ display:'flex', alignItems:'center', gap:10, cursor:'pointer', padding:'4px 0' }}>
                      <input type="checkbox" style=${{ width:18, height:18, accentColor:'var(--accent)' }} checked=${!!harianSelected[m.id]} onChange=${e => setHarianSelected({...harianSelected, [m.id]: e.target.checked})} />
                      <span style=${{ fontSize:14, fontWeight:500 }}>${m.nama}</span>
                    </label>
                  `)}
                </div>
                <button class="btn-primary" onClick=${cetakHarian}><${I.Printer} style=${{width:16,height:16}}/> Cetak Halaman Warna (PDF)</button>
              </div>
            </div>
          </div>
        `}
        ${toast && html`<${Toast} msg=${toast.msg} type=${toast.type} />`}
      </div>
      <div class="print-only"><${PrintOverlay} printData=${printData} settings=${settings} getSupplierName=${getSupplierName} getMenuName=${getMenuName} /></div>
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app-root'));
</script>
</body>
</html>
