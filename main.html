<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TitipBekal Lite</title>

<!-- Font & Tailwind -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>

<!-- Barcode & Scanner Libraries -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #111827; --paper: #f9fafb; --paper2: #f3f4f6;
    --accent: #f59e0b; --accent-hover: #d97706;
    --expense: #ef4444; --success: #10b981; --info: #3b82f6;
    --muted: #6b7280; --border: #e5e7eb; --card: #ffffff;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --radius: 12px;
  }
  .dark {
    --ink: #f9fafb; --paper: #111827; --paper2: #1f2937;
    --accent: #fbbf24; --expense: #f87171; --success: #34d399; --info: #60a5fa;
    --muted: #9ca3af; --border: #374151; --card: #1f2937;
    --shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }

  .anim-up { animation: fadeUp 0.3s ease-out both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

  .btn-primary { background: var(--accent); color: #fff; border: 2px solid var(--accent); border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); background: var(--paper2); }
  .btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }

  .input-field { width: 100%; background: var(--paper2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .input-field:focus { border-color: var(--accent); }
  .input-field[type="file"] { padding: 6px; font-size: 12px; cursor: pointer; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }

  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 200; background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); animation: fadeUp 0.3s both; }

  .tab-bar { display:flex; gap:4px; background:var(--paper2); padding:4px; border-radius:10px; border:1px solid var(--border); width:fit-content; }
  .tab-btn { padding:8px 16px; font-size:13px; font-weight:600; border-radius:7px; color:var(--muted); cursor:pointer; transition:all .15s; border:none; background:transparent; display:inline-flex; align-items:center; justify-content:center; gap:6px; flex: 1; }
  .tab-btn.active { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1); }

  /* MENGATUR TAMPILAN CETAK (HIGH CONTRAST B&W) */
  @media screen {
    .print-only { display: none !important; }
  }
  @media print {
    body { background: white !important; color: black !important; margin: 0; padding: 0; }
    .no-print { display: none !important; }
    .print-only { display: block !important; width: 100%; }
    
    /* Format Cetak: Struk Bluetooth Thermal (58mm) */
    .print-struk { width: 58mm; margin: 0; padding: 0; font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.4; color: #000; }
    .print-struk h3 { font-size: 16px; text-align: center; margin: 0 0 4px 0; color: #000; }
    .print-struk .biz-info { text-align: center; font-size: 10px; margin-bottom: 8px; color: #000; }
    .print-struk table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .print-struk th, .print-struk td { padding: 4px 0; vertical-align: top; border-bottom: 1px dashed #000; }
    .print-struk .dashed-line { border-top: 1px dashed #000; margin: 8px 0; }
    
    /* Format Cetak: Daftar Menu Harian & Rekap (A4/PDF) */
    .print-a4 { width: 100%; font-family: 'DM Sans', sans-serif; color: #000; }
    .print-a4 .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
    .print-a4 .header h2 { margin: 0; font-size: 24px; color: #000; }
    .print-a4 .header p { margin: 4px 0 0 0; font-size: 14px; color: #444; }
    .print-a4 table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .print-a4 th, .print-a4 td { border: 1px solid #000; padding: 8px; text-align: left; color: #000; }
    .print-a4 th { background: #f0f0f0; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .kategori-title { font-size: 18px; font-weight: bold; margin-top: 16px; border-bottom: 2px solid #000; padding-bottom: 4px; color: #000; }
    .menu-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ccc; }
  }

  /* Override html5-qrcode styling to fit mobile better */
  #qr-reader { border: none !important; border-radius: 8px; overflow: hidden; }
  #qr-reader button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; margin: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="app-root"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.6';
import { useState, useMemo, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.19.6/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

const GAS_TEMPLATE = `// Gunakan ini pada Google Apps Script (script.new)
function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    
    function writeSheet(sheetName, headers, items) {
      var sheet = ss.getSheetByName(sheetName);
      if(!sheet) { sheet = ss.insertSheet(sheetName); }
      sheet.clear();
      sheet.appendRow(headers);
      sheet.getRange(1, 1, 1, headers.length).setFontWeight("bold");
      if(items && items.length > 0) sheet.getRange(2, 1, items.length, headers.length).setValues(items);
    }

    if(data.suppliers) writeSheet("Suppliers", ["ID", "Nama", "No HP", "Alamat", "Bank", "No Rekening"], data.suppliers.map(s => [s.id, s.nama, s.hp, s.alamat, s.bank||'', s.rekening||'']));
    if(data.menus) writeSheet("Menus", ["ID", "Supplier ID", "Nama Menu", "Kategori"], data.menus.map(m => [m.id, m.supplierId, m.nama, m.kategori]));
    if(data.titip) {
      var titipRows = []; data.titip.forEach(t => t.items.forEach(i => titipRows.push([t.id, t.tanggal, t.supplierId, i.menuId, i.qty])));
      writeSheet("Titip", ["ID Transaksi", "Tanggal", "Supplier ID", "Menu ID", "Qty Titip"], titipRows);
    }
    if(data.ambil) {
      var ambilRows = []; data.ambil.forEach(a => a.items.forEach(i => ambilRows.push([a.id, a.titipId||'', a.tanggal, a.supplierId, i.menuId, i.sisa, i.terjual, a.hargaJual||0, a.komisi||0])));
      writeSheet("Ambil_Jual", ["ID Transaksi", "ID Titip", "Tanggal", "Supplier ID", "Menu ID", "Sisa", "Terjual", "Harga Jual", "Komisi"], ambilRows);
    }
    
    return ContentService.createTextOutput(JSON.stringify({ok: true})).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({error: err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}`;

const LS = { get: (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const formatRp = (n) => new Intl.NumberFormat('id-ID').format(n);
const formatWA = (hp) => { let n = hp.replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.substring(1); return n; };

const I = {
  Plus: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  Trash: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  Edit: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  X: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  Check: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  Inbox: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
  Outbox: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="12" y1="11" x2="12" y2="2"/><polyline points="9 5 12 2 15 5"/></svg>`,
  Calendar: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  Search: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  Users: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  Coffee: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`,
  Printer: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>`,
  Settings: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  Cloud: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`,
  MessageCircle: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
  Sun: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
  Moon: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
  Scan: (p) => html`<svg ...${p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>`
};

function Toast({ msg, type }) {
  const isErr = type === 'err';
  return html`
    <div class="toast" style=${{ background: isErr ? 'var(--expense)' : 'var(--ink)' }}>
      ${isErr ? html`<${I.X} style=${{width:14,height:14,flexShrink:0}} />` : html`<${I.Check} style=${{width:14,height:14,flexShrink:0}} />`}
      <span>${msg}</span>
    </div>
  `;
}

function PrintOverlay({ printData, settings, getSupplierName, getMenuName }) {
  if (!printData) return null;

  // Render Barcode saat DOM siap
  useEffect(() => {
    if (printData && (printData.type === 'titip' || printData.type === 'ambil') && window.JsBarcode) {
      setTimeout(() => {
        window.JsBarcode("#print-barcode", printData.id, {
          format: "CODE128", width: 1.5, height: 40, displayValue: true, fontSize: 12, margin: 0
        });
      }, 50);
    }
  }, [printData]);

  const biz = settings.bizInfo;
  const BizHeader = () => html`
    ${biz.logo && html`<div style=${{width:'100%', marginBottom:8}}><img src=${biz.logo} style=${{maxHeight:60, maxWidth:'100%', display:'block', margin:'0 auto'}} /></div>`}
    <h3>${biz.nama || 'TITIP BEKAL'}</h3>
    <div class="biz-info">
      ${biz.alamat && html`<div>${biz.alamat}</div>`}
      ${(biz.telp || biz.sosmed) && html`<div>${biz.telp} ${biz.sosmed ? ' | ' + biz.sosmed : ''}</div>`}
    </div>
    <div class="dashed-line"></div>
  `;

  if (printData.type === 'titip' || printData.type === 'ambil') {
    const tgl = new Date(printData.tanggal).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const supName = getSupplierName(printData.supplierId);
    
    let totalLaku = 0, kotor = 0, potKomisi = 0, bersih = 0;
    if(printData.type === 'ambil') {
      const hj = printData.hargaJual || 0;
      const kom = printData.komisi || 0;
      printData.items.forEach(i => totalLaku += i.terjual);
      kotor = totalLaku * hj;
      potKomisi = totalLaku * kom;
      bersih = kotor - potKomisi;
    }

    return html`
      <div class="print-struk">
        <${BizHeader} />
        <p style=${{ margin:0, fontSize:12 }}>Tgl: ${tgl}<br/>Sup: ${supName}<br/>Tipe: <b>${printData.type === 'titip' ? 'PENITIPAN' : 'PENGAMBILAN (REKAP)'}</b></p>
        
        <div style=${{ textAlign: 'center', marginTop: 10, marginBottom: 5 }}>
          <svg id="print-barcode"></svg>
        </div>
        
        <div class="dashed-line"></div>
        <table>
          <thead>
            <tr style=${{ textAlign:'left', fontSize:11 }}>
              <th>Menu</th>
              <th style=${{ textAlign:'center', width:30 }}>${printData.type === 'titip' ? 'Qty' : 'Ttp'}</th>
              ${printData.type === 'ambil' ? html`<th style=${{ textAlign:'center', width:30 }}>Sisa</th><th style=${{ textAlign:'center', width:30 }}>Laku</th>` : null}
            </tr>
          </thead>
          <tbody>
            ${printData.items.map(item => html`
              <tr>
                <td style=${{ paddingRight:4 }}>${getMenuName(item.menuId)}</td>
                <td style=${{ textAlign:'center' }}>${printData.type === 'titip' ? item.qty : item.awal}</td>
                ${printData.type === 'ambil' ? html`
                  <td style=${{ textAlign:'center' }}>${item.sisa}</td>
                  <td style=${{ textAlign:'center', fontWeight:'bold' }}>${item.terjual}</td>
                ` : null}
              </tr>
            `)}
          </tbody>
        </table>
        
        ${printData.type === 'ambil' && html`
          <div class="dashed-line"></div>
          <div style=${{display:'flex', justifyContent:'space-between'}}><span>Total Laku:</span> <span>${totalLaku} pcs</span></div>
          <div style=${{display:'flex', justifyContent:'space-between'}}><span>Bruto:</span> <span>Rp ${formatRp(kotor)}</span></div>
          <div style=${{display:'flex', justifyContent:'space-between'}}><span>Komisi Lapak:</span> <span>-Rp ${formatRp(potKomisi)}</span></div>
          <div class="dashed-line"></div>
          <div style=${{display:'flex', justifyContent:'space-between', fontWeight:'bold', fontSize:13}}><span>Total Bersih:</span> <span>Rp ${formatRp(bersih)}</span></div>
        `}

        <div class="dashed-line"></div>
        <p style=${{ textAlign:'center', margin:'10px 0 0 0', fontSize:11 }}>Terima Kasih</p>
      </div>
    `;
  }

  if (printData.type === 'harian' || printData.type === 'rekap') {
    // ... (Kode cetak A4 harian & rekap sama seperti sebelumnya, dilewati untuk ringkas di pemikiran, namun kode utuh di bawah)
    const tgl = new Date(printData.tanggal).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    
    if (printData.type === 'harian') {
      return html`
        <div class="print-a4">
          <div class="header">
            ${biz.logo && html`<img src=${biz.logo} style=${{maxHeight:80, marginBottom:10, display:'block', margin:'0 auto'}} />`}
            <h2>${biz.nama || 'TITIP BEKAL'}</h2>
            <p>${biz.alamat} | Telp: ${biz.telp}</p>
          </div>
          <h3 style=${{textAlign:'center', marginTop:20, marginBottom:10}}>Daftar Menu Harian - ${tgl}</h3>
          <div class="menu-grid">
            ${Object.entries(printData.groupedMenus).map(([kat, menus]) => html`
              <div>
                <div class="kategori-title">${kat || 'Lainnya'}</div>
                ${menus.map(m => html`
                  <div class="menu-item">
                    <span style=${{ fontWeight:600 }}>${m.nama}</span>
                  </div>
                `)}
              </div>
            `)}
          </div>
        </div>
      `;
    } else {
      return html`
        <div class="print-a4">
          <div class="header">
            ${biz.logo && html`<img src=${biz.logo} style=${{maxHeight:80, marginBottom:10, display:'block', margin:'0 auto'}} />`}
            <h2>${biz.nama || 'TITIP BEKAL'}</h2>
            <p>Laporan Rekapitulasi Harian - ${tgl}</p>
          </div>
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Supplier</th>
                <th>Nama Menu</th>
                <th style=${{textAlign:'center'}}>Titip</th>
                <th style=${{textAlign:'center'}}>Sisa</th>
                <th style=${{textAlign:'center'}}>Laku</th>
              </tr>
            </thead>
            <tbody>
              ${printData.rekapList.map((r, i) => html`
                <tr>
                  <td>${i+1}</td>
                  <td>${getSupplierName(r.supplierId)}</td>
                  <td>${getMenuName(r.menuId)}</td>
                  <td style=${{textAlign:'center'}}>${r.awal}</td>
                  <td style=${{textAlign:'center'}}>${r.sisa}</td>
                  <td style=${{textAlign:'center', fontWeight:'bold'}}>${r.terjual}</td>
                </tr>
              `)}
            </tbody>
          </table>
        </div>
      `;
    }
  }

  return null;
}

function App() {
  const [dark, setDark] = useState(() => LS.get('tb_theme') === 'dark');
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); LS.set('tb_theme', dark ? 'dark' : 'light'); }, [dark]);

  const [activeTab, setActiveTab] = useState('transaksi');
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const notify = useCallback((msg, type = 'ok') => {
    if(toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, type });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }, []);

  const [suppliers, setSuppliers] = useState(() => LS.get('tb_suppliers', []));
  const [menus, setMenus] = useState(() => LS.get('tb_menus', []));
  const [titip, setTitip] = useState(() => LS.get('tb_titip', []));
  const [ambil, setAmbil] = useState(() => LS.get('tb_ambil', []));
  const [syncUrl, setSyncUrl] = useState(() => LS.get('tb_syncUrl', ''));
  
  const defaultSettings = { bizInfo: { nama: 'TitipBekal', alamat: '', telp: '', sosmed: '', logo: '' }, hargaJual: 2000, komisi: 200 };
  const [settings, setSettings] = useState(() => LS.get('tb_settings', defaultSettings));
  const [kategoriList, setKategoriList] = useState(() => LS.get('tb_kategori', ['Makanan', 'Minuman', 'Kue basah', 'Snack']));
  const [searchTx, setSearchTx] = useState('');
  const [searchMaster, setSearchMaster] = useState('');

  const saveState = (key, data, setter) => { setter(data); LS.set(key, data); syncToCloud(); };
  const syncToCloud = async () => {
    if(!syncUrl) return;
    try { await fetch(syncUrl, { method: 'POST', body: JSON.stringify({ suppliers, menus, titip, ambil }) }); } 
    catch(e) { console.warn('Sync error', e); }
  };

  const getSupplierName = (id) => { const s = suppliers.find(x => x.id === id); return s ? s.nama : 'Unknown'; };
  const getMenuName = (id) => { const m = menus.find(x => x.id === id); return m ? m.nama : 'Unknown'; };

  const [modal, setModal] = useState(null);
  const todayStr = new Date().toISOString().split('T')[0];
  const [printData, setPrintData] = useState(null);

  const executePrint = (data) => {
    setPrintData(data);
    setTimeout(() => {
      window.print();
      setModal(null);
    }, 500);
  };

  // --- HTML5 QR CODE SCANNER EFFECT ---
  useEffect(() => {
    let scanner = null;
    if (modal === 'scan' && window.Html5QrcodeScanner) {
      setTimeout(() => {
        scanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        scanner.render((decodedText) => {
          scanner.clear();
          setModal(null);
          // Cari ID Titip
          const foundTitip = titip.find(t => t.id === decodedText);
          if(foundTitip) {
            openAmbilModal(foundTitip);
          } else {
            notify("Data Titip tidak ditemukan untuk struk ini", "err");
          }
        }, (err) => { /* ignore */ });
      }, 100);
    }
    return () => { if(scanner) scanner.clear().catch(e=>console.log(e)); }
  }, [modal]);

  // --- MASTER SUPPLIER & MENU ---
  // (Kode sama persis seperti sebelumnya)
  const [supForm, setSupForm] = useState({ id: '', nama: '', hp: '', alamat: '', bank: '', rekening: '' });
  const openSupplierModal = (sup = null) => { if (sup) setSupForm({ ...sup }); else setSupForm({ id: 'sup-'+Date.now(), nama: '', hp: '', alamat: '', bank: '', rekening: '' }); setModal('supplier'); };
  const saveSupplier = (e) => { e.preventDefault(); if(!supForm.nama.trim()) return notify('Nama wajib diisi', 'err'); let newSups = [...suppliers]; const idx = newSups.findIndex(s => s.id === supForm.id); if (idx >= 0) newSups[idx] = supForm; else newSups.push(supForm); saveState('tb_suppliers', newSups, setSuppliers); setModal(null); notify('Supplier tersimpan'); };
  const hapusSupplier = (id) => { if(menus.some(m => m.supplierId === id)) return notify('Gagal: Supplier memiliki menu', 'err'); if(!confirm('Hapus supplier ini?')) return; saveState('tb_suppliers', suppliers.filter(s => s.id !== id), setSuppliers); };

  const [menuForm, setMenuForm] = useState({ id: '', supplierId: '', nama: '', kategori: kategoriList[0] || '' });
  const openMenuModal = (menu = null) => { if (menu) setMenuForm({ ...menu }); else setMenuForm({ id: 'menu-'+Date.now(), supplierId: suppliers[0]?.id || '', nama: '', kategori: kategoriList[0] || '' }); setModal('menu'); };
  const saveMenu = (e) => { e.preventDefault(); if(!menuForm.nama.trim() || !menuForm.supplierId) return notify('Lengkapi data menu & pilih supplier', 'err'); let newMenus = [...menus]; const idx = newMenus.findIndex(m => m.id === menuForm.id); if (idx >= 0) newMenus[idx] = menuForm; else newMenus.push(menuForm); saveState('tb_menus', newMenus, setMenus); setModal(null); notify('Menu tersimpan'); };
  const hapusMenu = (id) => { if(!confirm('Hapus menu ini?')) return; saveState('tb_menus', menus.filter(m => m.id !== id), setMenus); };

  // --- HARIAN ---
  const [harianDate, setHarianDate] = useState(todayStr);
  const [harianSelected, setHarianSelected] = useState({});
  const openHarianModal = () => { setHarianDate(todayStr); setHarianSelected({}); setModal('harian'); };
  const cetakHarian = () => {
    const selectedIds = Object.keys(harianSelected).filter(k => harianSelected[k]);
    if(selectedIds.length === 0) return notify('Pilih minimal 1 menu', 'err');
    const selectedMenus = menus.filter(m => selectedIds.includes(m.id));
    const grouped = {};
    selectedMenus.forEach(m => { const kat = m.kategori || 'Lainnya'; if(!grouped[kat]) grouped[kat] = []; grouped[kat].push(m); });
    executePrint({ type: 'harian', tanggal: harianDate, groupedMenus: grouped });
  };

  // --- TRANSAKSI TITIP ---
  const [titipSup, setTitipSup] = useState('');
  const [titipItems, setTitipItems] = useState({});
  const [editingTitipId, setEditingTitipId] = useState(null);
  
  const openTitipModal = (existing = null) => {
    if(existing) {
      setTitipSup(existing.supplierId); setEditingTitipId(existing.id);
      const st = {}; existing.items.forEach(i => { st[i.menuId] = i.qty; });
      setTitipItems(st);
    } else {
      setTitipSup(''); setTitipItems({}); setEditingTitipId(null);
    }
    setModal('titip');
  };
  
  const saveTitip = () => {
    const items = Object.entries(titipItems).filter(([_, qty]) => Number(qty) > 0).map(([menuId, qty]) => ({ menuId, qty: Number(qty) }));
    if(items.length === 0) return notify('Masukkan jumlah penitipan minimal 1', 'err');
    
    // Validasi Ganda (Mencegah Titip berulang di hari yang sama untuk supplier yang sama)
    if (!editingTitipId) {
      const isDuplicate = titip.find(t => t.tanggal === todayStr && t.supplierId === titipSup);
      if (isDuplicate) {
        const confirmLanjut = confirm(`Peringatan: Supplier ${getSupplierName(titipSup)} sudah menitip barang hari ini. Apakah ini titipan susulan (kloter kedua)? Klik OK untuk melanjutkan.`);
        if (!confirmLanjut) return;
      }
    }

    const record = { id: editingTitipId || 'ttp-'+Date.now(), tanggal: todayStr, supplierId: titipSup, items };
    let newTitip = [...titip];
    if(editingTitipId) { const idx = newTitip.findIndex(t => t.id === editingTitipId); if(idx >= 0) newTitip[idx] = record; } 
    else newTitip.unshift(record);
    saveState('tb_titip', newTitip, setTitip);
    executePrint({ type: 'titip', ...record });
  };

  // --- TRANSAKSI AMBIL ---
  const [ambilSup, setAmbilSup] = useState('');
  const [ambilRefTitipId, setAmbilRefTitipId] = useState(''); // Menyimpan relasi ke ID Titip
  const [ambilSisa, setAmbilSisa] = useState({});
  const [editingAmbilId, setEditingAmbilId] = useState(null);
  
  // Data barang yang mau diambil kini mengacu pada SATU struk titip saja
  const targetTitipForAmbil = useMemo(() => {
    if(!ambilRefTitipId) return [];
    const t = titip.find(x => x.id === ambilRefTitipId);
    if (!t) return [];
    return t.items.map(i => ({ menuId: i.menuId, qty: i.qty }));
  }, [titip, ambilRefTitipId]);

  // Fungsi dipanggil HANYA dari tombol "Proses Ambil" di list titip atau Scanner
  const openAmbilModal = (titipRecord, existingAmbil = null) => {
    setAmbilSup(titipRecord.supplierId);
    setAmbilRefTitipId(titipRecord.id);
    
    if(existingAmbil) {
      setEditingAmbilId(existingAmbil.id);
      const st = {}; existingAmbil.items.forEach(i => { st[i.menuId] = i.sisa; });
      setAmbilSisa(st);
    } else {
      setEditingAmbilId(null);
      setAmbilSisa({});
    }
    setModal('ambil');
  };

  const saveAmbil = () => {
    if(targetTitipForAmbil.length === 0) return notify('Tidak ada referensi titipan', 'err');
    const items = targetTitipForAmbil.map(t => {
      const sisa = Number(ambilSisa[t.menuId]) || 0;
      const terjual = Math.max(0, t.qty - sisa);
      return { menuId: t.menuId, awal: t.qty, sisa, terjual };
    });
    
    // Validasi Ganda Ambil
    if (!editingAmbilId) {
      const isDuplicate = ambil.find(a => a.titipId === ambilRefTitipId);
      if (isDuplicate) {
        const confirmLanjut = confirm(`Peringatan: Struk Titip ini sudah pernah diproses Ambil. Yakin ingin membuat nota Ambil baru untuk struk ini?`);
        if (!confirmLanjut) return;
      }
    }

    const record = { 
      id: editingAmbilId || 'amb-'+Date.now(), titipId: ambilRefTitipId, tanggal: todayStr, supplierId: ambilSup, 
      items, hargaJual: settings.hargaJual, komisi: settings.komisi 
    };
    
    let newAmbil = [...ambil];
    if(editingAmbilId) { const idx = newAmbil.findIndex(a => a.id === editingAmbilId); if(idx >= 0) newAmbil[idx] = record; } 
    else newAmbil.unshift(record);
    saveState('tb_ambil', newAmbil, setAmbil);
    executePrint({ type: 'ambil', ...record });
  };

  // --- REKAP HARIAN LOGIC ---
  const titipTodayList = useMemo(() => titip.filter(t => t.tanggal === todayStr), [titip, todayStr]);
  const ambilTodayList = useMemo(() => ambil.filter(a => a.tanggal === todayStr), [ambil, todayStr]);
  
  const isAllAmbilDone = useMemo(() => {
    const supsTitip = [...new Set(titipTodayList.map(t => t.supplierId))];
    const supsAmbil = [...new Set(ambilTodayList.map(a => a.supplierId))];
    return supsTitip.length > 0 && supsTitip.every(id => supsAmbil.includes(id));
  }, [titipTodayList, ambilTodayList]);

  const cetakRekapHarian = () => {
    const rekap = [];
    ambilTodayList.forEach(a => {
      a.items.forEach(i => { rekap.push({ supplierId: a.supplierId, menuId: i.menuId, awal: i.awal, sisa: i.sisa, terjual: i.terjual }); });
    });
    executePrint({ type: 'rekap', tanggal: todayStr, rekapList: rekap });
  };


  // --- RENDER CONTENT ---
  const renderContent = () => {
    if (activeTab === 'transaksi') {
      let totalLaku = 0;
      ambilTodayList.forEach(a => a.items.forEach(i => { totalLaku += i.terjual; }));

      // Mencari Titipan yang belum diambil hari ini
      const combinedActs = titip.map(t => {
        const correspondingAmbil = ambil.find(a => a.titipId === t.id);
        return { ...t, _type: 'Titip', isDone: !!correspondingAmbil, relatedAmbil: correspondingAmbil };
      }).sort((a,b) => b.id.localeCompare(a.id));

      const filteredActs = searchTx ? combinedActs.filter(act => 
        getSupplierName(act.supplierId).toLowerCase().includes(searchTx.toLowerCase()) || 
        act.tanggal.includes(searchTx) || act.id.includes(searchTx)
      ) : combinedActs.slice(0, 15);

      return html`
        <div class="anim-up">
          <div class="card" style=${{ padding:20, marginBottom:20, background: dark ? 'var(--card)' : 'linear-gradient(135deg, #10b981 0%, #059669 100%)', color: dark?'inherit':'#fff' }}>
            <h2 style=${{ fontSize:16, fontWeight:700, marginBottom:16 }}>Ringkasan Penjualan</h2>
            <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <div>
                <div style=${{ fontSize:12, opacity:0.9 }}>Total Terjual (Pcs)</div>
                <div style=${{ fontSize:28, fontWeight:700 }}>${totalLaku}</div>
              </div>
              <div style=${{ display:'flex', flexDirection:'column', gap:8, borderLeft: dark ? '1px solid var(--border)' : '1px solid rgba(255,255,255,0.3)', paddingLeft:16 }}>
                <div style=${{ fontSize:12 }}><b style=${{fontSize:16}}>${titipTodayList.length}</b> Titipan Hari ini</div>
                <div style=${{ fontSize:12 }}><b style=${{fontSize:16}}>${ambilTodayList.length}</b> Pengambilan Selesai</div>
              </div>
            </div>
          </div>

          <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
            <button class="btn-primary" style=${{ height:60, flexDirection:'column', gap:2 }} onClick=${()=>openTitipModal()}>
              <${I.Inbox} style=${{width:20,height:20}} /> Buat Titipan Baru
            </button>
            <button class="btn-primary" style=${{ height:60, flexDirection:'column', gap:2, background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${()=>setModal('scan')}>
              <${I.Scan} style=${{width:20,height:20}} /> Scan Struk Ambil
            </button>
          </div>
          
          <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:24 }}>
            <button class="btn-ghost" style=${{ height:50, background:'var(--card)' }} onClick=${openHarianModal}>
              <${I.Calendar} style=${{width:16,height:16}} /> Menu Harian
            </button>
            <button class="btn-ghost" style=${{ height:50, background:'var(--card)', color: isAllAmbilDone?'var(--ink)':'var(--muted)' }} 
              disabled=${!isAllAmbilDone} onClick=${cetakRekapHarian} title="Aktif jika semua titipan sudah diambil">
              <${I.Printer} style=${{width:16,height:16}} /> Rekap Harian
            </button>
          </div>
          
          <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
            <h3 style=${{ fontSize:14, fontWeight:700, color:'var(--muted)' }}>Daftar Transaksi Titipan</h3>
          </div>
          <div style=${{ position:'relative', marginBottom:12 }}>
            <${I.Search} style=${{ width:16, height:16, position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)' }} />
            <input type="text" class="input-field" style=${{ paddingLeft:36, height:38 }} placeholder="Cari nama atau barcode ID..." 
              value=${searchTx} onInput=${e => setSearchTx(e.target.value)} />
          </div>

          <div style=${{ display:'flex', flexDirection:'column', gap:10 }}>
            ${filteredActs.length === 0 ? html`<div style=${{fontSize:13, color:'var(--muted)', textAlign:'center', padding:20}}>Tidak ditemukan.</div>` : filteredActs.map(act => html`
              <div class="card" style=${{ padding:12, display:'flex', flexDirection:'column', gap:12 }} key=${act.id}>
                <div style=${{ display:'flex', alignItems:'center', gap:12 }}>
                  <div style=${{ width:36, height:36, borderRadius:8, background:'var(--paper2)', display:'flex', alignItems:'center', justifyContent:'center', color: 'var(--accent)' }}>
                    <${I.Inbox} style=${{width:18,height:18}}/>
                  </div>
                  <div style=${{ flex:1 }}>
                    <div style=${{ fontSize:14, fontWeight:600 }}>${getSupplierName(act.supplierId)}</div>
                    <div style=${{ fontSize:11, color:'var(--muted)' }}>ID: ${act.id} • ${act.tanggal}</div>
                  </div>
                  <div style=${{ display:'flex', gap:4 }}>
                    <button class="btn-ghost" style=${{ padding:6, border:'none' }} onClick=${() => openTitipModal(act)}><${I.Edit} style=${{width:16,height:16}}/></button>
                    <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--info)' }} onClick=${() => executePrint({ type: 'titip', ...act })}><${I.Printer} style=${{width:16,height:16}}/></button>
                  </div>
                </div>
                
                <div style=${{ borderTop: '1px dashed var(--border)', paddingTop: 10, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div style=${{ fontSize: 12, fontWeight: 600, color: act.isDone ? 'var(--success)' : 'var(--expense)' }}>
                    ${act.isDone ? 'Status: Selesai Diambil' : 'Status: Belum Diambil'}
                  </div>
                  ${!act.isDone ? html`
                    <button class="btn-primary" style=${{ padding:'6px 12px', fontSize:12, background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${() => openAmbilModal(act)}>
                      Proses Ambil
                    </button>
                  ` : html`
                    <div style=${{ display:'flex', gap:6 }}>
                      <button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11 }} onClick=${() => openAmbilModal(act, act.relatedAmbil)}>Edit Ambil</button>
                      <button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11, color:'var(--info)' }} onClick=${() => executePrint({ type: 'ambil', ...act.relatedAmbil })}>Cetak Rekap</button>
                    </div>
                  `}
                </div>
              </div>
            `)}
          </div>
        </div>
      `;
    }

    if (activeTab === 'master') {
      // (Render Master persis sama, saya potong demi menghemat baris tanpa mengurangi fitur)
      const filteredSups = suppliers.filter(s => s.nama.toLowerCase().includes(searchMaster.toLowerCase()));
      const filteredMenus = menus.filter(m => m.nama.toLowerCase().includes(searchMaster.toLowerCase()) || getSupplierName(m.supplierId).toLowerCase().includes(searchMaster.toLowerCase()));

      return html`
        <div class="anim-up" style=${{ display:'flex', flexDirection:'column', gap:24 }}>
          <div style=${{ position:'relative' }}>
            <${I.Search} style=${{ width:16, height:16, position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)' }} />
            <input type="text" class="input-field" style=${{ paddingLeft:36, height:38 }} placeholder="Cari supplier atau menu..." 
              value=${searchMaster} onInput=${e => setSearchMaster(e.target.value)} />
          </div>

          <div>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
              <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6 }}><${I.Users} style=${{width:16,height:16}}/> Data Supplier</h3>
              <button class="btn-ghost" style=${{ padding:'6px 12px', fontSize:12 }} onClick=${()=>openSupplierModal()}><${I.Plus} style=${{width:14,height:14}}/> Tambah</button>
            </div>
            ${filteredSups.length === 0 ? html`<div style=${{fontSize:13, color:'var(--muted)'}}>Supplier tidak ditemukan.</div>` : html`
              <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
                ${filteredSups.map(s => html`
                  <div class="card" style=${{ padding:12, display:'flex', flexDirection:'column', gap:8 }} key=${s.id}>
                    <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                      <div>
                        <div style=${{ fontSize:14, fontWeight:600 }}>${s.nama}</div>
                        <div style=${{ fontSize:12, color:'var(--muted)' }}>${s.hp || '-'} | ${s.bank ? `${s.bank} - ${s.rekening}` : 'No Rek: -'}</div>
                      </div>
                      <div style=${{ display:'flex', gap:4 }}>
                        ${s.hp && html`<a href="https://wa.me/${formatWA(s.hp)}" target="_blank" class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--success)' }}><${I.MessageCircle} style=${{width:16,height:16}}/></a>`}
                        <button class="btn-ghost" style=${{ padding:6, border:'none' }} onClick=${()=>openSupplierModal(s)}><${I.Edit} style=${{width:16,height:16}}/></button>
                        <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--expense)' }} onClick=${()=>hapusSupplier(s.id)}><${I.Trash} style=${{width:16,height:16}}/></button>
                      </div>
                    </div>
                  </div>
                `)}
              </div>
            `}
          </div>

          <div>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
              <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6 }}><${I.Coffee} style=${{width:16,height:16}}/> Data Menu</h3>
              <button class="btn-ghost" style=${{ padding:'6px 12px', fontSize:12 }} onClick=${()=>openMenuModal()}><${I.Plus} style=${{width:14,height:14}}/> Tambah</button>
            </div>
            ${filteredMenus.length === 0 ? html`<div style=${{fontSize:13, color:'var(--muted)'}}>Menu tidak ditemukan.</div>` : html`
              <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
                ${filteredMenus.map(m => html`
                  <div class="card list-row" style=${{padding:12, display:'flex', justifyContent:'space-between'}} key=${m.id}>
                    <div>
                      <div style=${{ fontSize:14, fontWeight:600 }}>${m.nama}</div>
                      <div style=${{ fontSize:12, color:'var(--muted)' }}>${m.kategori} • Sup: ${getSupplierName(m.supplierId)}</div>
                    </div>
                    <div style=${{ display:'flex', gap:4 }}>
                      <button class="btn-ghost" style=${{ padding:6, border:'none' }} onClick=${()=>openMenuModal(m)}><${I.Edit} style=${{width:16,height:16}}/></button>
                      <button class="btn-ghost" style=${{ padding:6, border:'none', color:'var(--expense)' }} onClick=${()=>hapusMenu(m.id)}><${I.Trash} style=${{width:16,height:16}}/></button>
                    </div>
                  </div>
                `)}
              </div>
            `}
          </div>
        </div>
      `;
    }

    if (activeTab === 'pengaturan') {
      // (Render Pengaturan persis sama, dipotong demi efisiensi)
      const [formSet, setFormSet] = useState(settings);
      const [newCat, setNewCat] = useState('');

      const simpanPengaturan = (e) => { e.preventDefault(); saveState('tb_settings', formSet, setSettings); notify('Pengaturan Berhasil Disimpan'); };
      const handleLogoUpload = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { setFormSet({...formSet, bizInfo: {...formSet.bizInfo, logo: ev.target.result}}); }; reader.readAsDataURL(file); };
      const addKategori = () => { if(!newCat.trim()) return; if(kategoriList.includes(newCat)) return notify('Kategori sudah ada', 'err'); const newArr = [...kategoriList, newCat]; setKategoriList(newArr); LS.set('tb_kategori', newArr); setNewCat(''); notify('Kategori ditambah'); };
      const hapusKategori = (kat) => { if(menus.some(m => m.kategori === kat)) return notify('Gagal: Kategori digunakan pada menu', 'err'); const newArr = kategoriList.filter(k => k !== kat); setKategoriList(newArr); LS.set('tb_kategori', newArr); };

      return html`
        <div class="anim-up card" style=${{ padding:20, display:'flex', flexDirection:'column', gap:24 }}>
          <form onSubmit=${simpanPengaturan}>
            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:16 }}>Profil Usaha (Kop Struk)</h3>
            <div style=${{ display:'flex', flexDirection:'column', gap:12, marginBottom:20 }}>
              <div>
                <label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Logo Usaha (Pilih gambar dari HP)</label>
                <div style=${{display:'flex', gap:10, alignItems:'center'}}>
                  ${formSet.bizInfo.logo && html`<img src=${formSet.bizInfo.logo} style=${{height:40, width:40, objectFit:'contain', borderRadius:4, border:'1px solid var(--border)'}} />`}
                  <input type="file" accept="image/*" class="input-field" onChange=${handleLogoUpload} style=${{flex:1, padding:6}} />
                  ${formSet.bizInfo.logo && html`<button type="button" class="btn-ghost" style=${{color:'var(--expense)', padding:6}} onClick=${()=>setFormSet({...formSet, bizInfo: {...formSet.bizInfo, logo:''}})}><${I.Trash} style=${{width:16,height:16}}/></button>`}
                </div>
              </div>
              <input type="text" class="input-field" placeholder="Nama Usaha (Bawaan: TITIP BEKAL)" value=${formSet.bizInfo.nama} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, nama: e.target.value}})} />
              <textarea class="input-field" placeholder="Alamat" rows="2" value=${formSet.bizInfo.alamat} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, alamat: e.target.value}})} />
              <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <input type="text" class="input-field" placeholder="No. Telpon" value=${formSet.bizInfo.telp} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, telp: e.target.value}})} />
                <input type="text" class="input-field" placeholder="Sosmed (IG/FB)" value=${formSet.bizInfo.sosmed} onInput=${e => setFormSet({...formSet, bizInfo: {...formSet.bizInfo, sosmed: e.target.value}})} />
              </div>
            </div>
            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:16 }}>Harga & Komisi Lapak (Global)</h3>
            <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:16 }}>
              <div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Harga Jual / Pcs (Rp)</label><input type="number" class="input-field" value=${formSet.hargaJual} onInput=${e => setFormSet({...formSet, hargaJual: Number(e.target.value)})} /></div>
              <div><label style=${{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4, display:'block'}}>Komisi Lapak / Pcs (Rp)</label><input type="number" class="input-field" value=${formSet.komisi} onInput=${e => setFormSet({...formSet, komisi: Number(e.target.value)})} /></div>
            </div>
            <button type="submit" class="btn-primary" style=${{width:'100%', justifyContent:'center'}}>Simpan Pengaturan</button>
          </form>

          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <h3 style=${{ fontSize:15, fontWeight:700, marginBottom:12 }}>Daftar Kategori Menu</h3>
            <div style=${{ display:'flex', flexDirection:'column', gap:8, marginBottom:12 }}>
              ${kategoriList.map(kat => html`<div style=${{display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid var(--border)'}} key=${kat}><span style=${{fontSize:13, fontWeight:600}}>${kat}</span><button class="btn-ghost" style=${{ padding:4, border:'none', color:'var(--expense)' }} onClick=${()=>hapusKategori(kat)}><${I.Trash} style=${{width:16,height:16}}/></button></div>`)}
            </div>
            <div style=${{ display:'flex', gap:8 }}>
              <input type="text" class="input-field" placeholder="Nama Kategori Baru" value=${newCat} onInput=${e => setNewCat(e.target.value)} />
              <button class="btn-primary" onClick=${addKategori}>Tambah</button>
            </div>
          </div>
          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 20 }}>
            <h3 style=${{ fontSize:15, fontWeight:700, display:'flex', alignItems:'center', gap:6, marginBottom:16 }}><${I.Cloud} style=${{width:18,height:18}}/> Cloud Sinkronisasi</h3>
            <input type="url" class="input-field" placeholder="https://script.google.com/macros/s/..." value=${syncUrl} onInput=${e => { setSyncUrl(e.target.value); LS.set('tb_syncUrl', e.target.value); }} style=${{ marginBottom:12 }} />
            <button class="btn-ghost" onClick=${syncToCloud}>Uji Sinkronisasi Sekarang</button>
            <details style=${{ marginTop:20, background:'var(--paper2)', padding:12, borderRadius:8 }}>
              <summary style=${{ fontSize:13, fontWeight:600, cursor:'pointer' }}>Lihat Kode GAS Template</summary>
              <pre style=${{ background:'#000', color:'#4ade80', padding:10, borderRadius:6, fontSize:10, marginTop:10, overflowX:'auto' }}>${GAS_TEMPLATE}</pre>
            </details>
          </div>
        </div>
      `;
    }
  };

  return html`
    <div>
      <!-- MAIN APP ROOT -->
      <div class="no-print" style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
        <header style=${{ background:'var(--card)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:30, padding:'12px 20px' }}>
          <div style=${{ maxWidth:600, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <h1 style=${{ fontSize:18, fontWeight:700, letterSpacing:'-0.5px', display:'flex', alignItems:'center', gap:6 }}>
              <div style=${{background:'var(--accent)', color:'#fff', width:28, height:28, borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center'}}>T</div>
              TitipBekal
            </h1>
            <button onClick=${() => setDark(!dark)} class="btn-ghost" style=${{padding:8, border:'none'}}>
              ${dark ? html`<${I.Sun} style=${{width:18,height:18}} />` : html`<${I.Moon} style=${{width:18,height:18}} />`}
            </button>
          </div>
        </header>

        <main style=${{ flex:1, maxWidth:600, margin:'0 auto', width:'100%', padding:'20px' }}>
          <div class="tab-bar" style=${{ marginBottom:20, width:'100%', display:'flex' }}>
            <button class=${`tab-btn ${activeTab === 'transaksi' ? 'active' : ''}`} onClick=${() => setActiveTab('transaksi')}>Transaksi</button>
            <button class=${`tab-btn ${activeTab === 'master' ? 'active' : ''}`} onClick=${() => setActiveTab('master')}>Master Data</button>
            <button class=${`tab-btn ${activeTab === 'pengaturan' ? 'active' : ''}`} onClick=${() => setActiveTab('pengaturan')}><${I.Settings} style=${{width:16,height:16}}/></button>
          </div>
          ${renderContent()}
        </main>

        <!-- MODALS -->
        ${modal === 'supplier' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <h3 style=${{ fontSize:16, fontWeight:700 }}>${supForm.id.startsWith('sup-') && !suppliers.find(s=>s.id===supForm.id) ? 'Tambah' : 'Edit'} Supplier</h3>
                <button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button>
              </div>
              <form onSubmit=${saveSupplier} style=${{ padding:20, display:'flex', flexDirection:'column', gap:12 }}>
                <input type="text" class="input-field" placeholder="Nama Supplier" required value=${supForm.nama} onInput=${e => setSupForm(f=>({...f, nama:e.target.value}))} />
                <input type="text" class="input-field" placeholder="No HP/WA (Mulai dengan 08 / 628)" value=${supForm.hp} onInput=${e => setSupForm(f=>({...f, hp:e.target.value}))} />
                <div style=${{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:12 }}>
                  <input type="text" class="input-field" placeholder="Nama Bank" value=${supForm.bank} onInput=${e => setSupForm(f=>({...f, bank:e.target.value}))} />
                  <input type="text" class="input-field" placeholder="No. Rekening" value=${supForm.rekening} onInput=${e => setSupForm(f=>({...f, rekening:e.target.value}))} />
                </div>
                <textarea class="input-field" placeholder="Alamat (opsional)" rows="2" value=${supForm.alamat} onInput=${e => setSupForm(f=>({...f, alamat:e.target.value}))} />
                <button type="submit" class="btn-primary" style=${{ marginTop:8 }}>Simpan</button>
              </form>
            </div>
          </div>
        `}

        ${modal === 'menu' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <h3 style=${{ fontSize:16, fontWeight:700 }}>${menuForm.id.startsWith('menu-') && !menus.find(m=>m.id===menuForm.id) ? 'Tambah' : 'Edit'} Menu</h3>
                <button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button>
              </div>
              <form onSubmit=${saveMenu} style=${{ padding:20, display:'flex', flexDirection:'column', gap:12 }}>
                <select class="input-field" required value=${menuForm.supplierId} onChange=${e => setMenuForm(f=>({...f, supplierId:e.target.value}))}>
                  <option value="" disabled>Pilih Supplier...</option>
                  ${suppliers.map(s => html`<option value=${s.id}>${s.nama}</option>`)}
                </select>
                <input type="text" class="input-field" placeholder="Nama Menu" required value=${menuForm.nama} onInput=${e => setMenuForm(f=>({...f, nama:e.target.value}))} />
                <select class="input-field" required value=${menuForm.kategori} onChange=${e => setMenuForm(f=>({...f, kategori:e.target.value}))}>
                  <option value="" disabled>Pilih Kategori...</option>
                  ${kategoriList.map(k => html`<option value=${k}>${k}</option>`)}
                </select>
                <button type="submit" class="btn-primary" style=${{ marginTop:8 }}>Simpan</button>
              </form>
            </div>
          </div>
        `}

        ${modal === 'titip' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', background:'var(--accent)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <h3 style=${{ fontSize:16, fontWeight:700 }}>${editingTitipId ? 'Edit Titipan' : 'Catat Titipan Baru'}</h3>
                <button class="btn-ghost" style=${{ padding:'4px', border:'none', color:'#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button>
              </div>
              <div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
                <select class="input-field" value=${titipSup} disabled=${!!editingTitipId} onChange=${e => { setTitipSup(e.target.value); setTitipItems({}); }}>
                  <option value="" disabled>1. Pilih Supplier</option>
                  ${suppliers.map(s => html`<option value=${s.id}>${s.nama}</option>`)}
                </select>
                ${titipSup && html`
                  <div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}>
                    <div style=${{ fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:4 }}>2. Masukkan Qty Menu Titipan</div>
                    ${menus.filter(m => m.supplierId === titipSup).map(m => html`
                      <div style=${{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
                        <span style=${{ fontSize:14, flex:1 }}>${m.nama}</span>
                        <input type="number" class="input-field" style=${{ width:80, padding:'6px 10px', textAlign:'center' }} placeholder="0" min="0" 
                          value=${titipItems[m.id]||''} onInput=${e => setTitipItems({...titipItems, [m.id]: e.target.value})} />
                      </div>
                    `)}
                  </div>
                  <button class="btn-primary" onClick=${saveTitip}><${I.Printer} style=${{width:16,height:16}}/> Simpan & Cetak Struk Barcode</button>
                `}
              </div>
            </div>
          </div>
        `}

        ${modal === 'ambil' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', background:'var(--ink)', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <h3 style=${{ fontSize:16, fontWeight:700 }}>${editingAmbilId ? 'Edit Pengambilan' : 'Proses Ambil (Rekap Laku)'}</h3>
                <button class="btn-ghost" style=${{ padding:'4px', border:'none', color:'#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button>
              </div>
              <div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
                
                <div style=${{ padding:12, background:'var(--paper2)', borderRadius:8, fontSize:13 }}>
                  <div><b>Supplier:</b> ${getSupplierName(ambilSup)}</div>
                  <div style=${{color:'var(--muted)', fontSize:11}}>ID Referensi: ${ambilRefTitipId}</div>
                </div>

                <div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}>
                  <div style=${{ display:'grid', gridTemplateColumns:'1fr 40px 60px 40px', gap:8, fontSize:11, fontWeight:700, color:'var(--muted)', marginBottom:4, textAlign:'center' }}>
                    <div style=${{textAlign:'left'}}>Nama Menu</div><div>Ttp</div><div>Sisa(Input)</div><div>Laku</div>
                  </div>
                  ${targetTitipForAmbil.map(t => {
                    const sisa = Number(ambilSisa[t.menuId]) || 0;
                    const terjual = Math.max(0, t.qty - sisa);
                    return html`
                      <div style=${{ display:'grid', gridTemplateColumns:'1fr 40px 60px 40px', gap:8, alignItems:'center', borderBottom:'1px solid var(--border)', paddingBottom:8 }}>
                        <span style=${{ fontSize:13, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${getMenuName(t.menuId)}</span>
                        <span style=${{ fontSize:13, textAlign:'center' }}>${t.qty}</span>
                        <input type="number" class="input-field" style=${{ padding:'4px 6px', textAlign:'center', height:32 }} placeholder="0" min="0" max=${t.qty}
                          value=${ambilSisa[t.menuId]||''} onInput=${e => setAmbilSisa({...ambilSisa, [t.menuId]: e.target.value})} />
                        <span style=${{ fontSize:14, fontWeight:700, textAlign:'center', color: terjual>0?'var(--success)':'var(--muted)' }}>${terjual}</span>
                      </div>
                    `;
                  })}
                  <div style=${{marginTop:8, paddingTop:8, borderTop:'1px dashed var(--border)', fontSize:12, color:'var(--muted)'}}>
                    <div>Harga Jual: Rp ${formatRp(settings.hargaJual)} /pcs</div>
                    <div>Komisi Lapak: Rp ${formatRp(settings.komisi)} /pcs</div>
                  </div>
                </div>
                <button class="btn-primary" style=${{ background:'var(--ink)', borderColor:'var(--ink)' }} onClick=${saveAmbil}><${I.Printer} style=${{width:16,height:16}}/> Simpan & Cetak Rekap</button>
              </div>
            </div>
          </div>
        `}

        ${modal === 'scan' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <h3 style=${{ fontSize:16, fontWeight:700 }}>Scan Barcode Struk</h3>
                <button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button>
              </div>
              <div style=${{ padding:20 }}>
                <p style=${{ fontSize:13, color:'var(--muted)', marginBottom:12, textAlign:'center' }}>Arahkan kamera ke barcode pada struk titipan untuk memproses pengambilan.</p>
                <div id="qr-reader" style=${{ width: '100%', minHeight: 250, background: '#000', borderRadius: 8 }}></div>
              </div>
            </div>
          </div>
        `}

        ${modal === 'harian' && html`
          <div class="modal-overlay anim-in" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding:'16px 20px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <h3 style=${{ fontSize:16, fontWeight:700 }}>Buat Menu Harian</h3>
                <button class="btn-ghost" style=${{ padding:'4px', border:'none' }} onClick=${() => setModal(null)}><${I.X} style=${{width:20,height:20}} /></button>
              </div>
              <div style=${{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
                <div>
                  <label style=${{ fontSize:12, fontWeight:600, display:'block', marginBottom:4 }}>Tanggal</label>
                  <input type="date" class="input-field" value=${harianDate} onInput=${e => setHarianDate(e.target.value)} />
                </div>
                <div style=${{ background:'var(--paper2)', padding:12, borderRadius:8, border:'1px solid var(--border)', display:'flex', flexDirection:'column', gap:8, maxHeight:'40vh', overflowY:'auto' }}>
                  <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                    <span style=${{ fontSize:13, fontWeight:600 }}>Pilih Menu:</span>
                    <button class="btn-ghost" style=${{ padding:'4px 8px', fontSize:11 }} onClick=${() => {
                      const allOn = Object.keys(harianSelected).length === menus.length;
                      const nextSt = {};
                      if(!allOn) menus.forEach(m => nextSt[m.id] = true);
                      setHarianSelected(nextSt);
                    }}>${Object.keys(harianSelected).length === menus.length ? 'Batal Semua' : 'Pilih Semua'}</button>
                  </div>
                  ${menus.map(m => html`
                    <label style=${{ display:'flex', alignItems:'center', gap:10, cursor:'pointer', padding:'4px 0' }}>
                      <input type="checkbox" style=${{ width:18, height:18, accentColor:'var(--accent)' }} 
                        checked=${!!harianSelected[m.id]} onChange=${e => setHarianSelected({...harianSelected, [m.id]: e.target.checked})} />
                      <div style=${{ display:'flex', flexDirection:'column' }}>
                        <span style=${{ fontSize:14, fontWeight:500 }}>${m.nama}</span>
                      </div>
                    </label>
                  `)}
                </div>
                <button class="btn-primary" onClick=${cetakHarian}><${I.Printer} style=${{width:16,height:16}}/> Cetak PDF / JPG</button>
              </div>
            </div>
          </div>
        `}
        ${toast && html`<${Toast} msg=${toast.msg} type=${toast.type} />`}
      </div>

      <!-- PRINT CONTAINER ROOT -->
      <div class="print-only">
        <${PrintOverlay} printData=${printData} settings=${settings} getSupplierName=${getSupplierName} getMenuName=${getMenuName} />
      </div>
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app-root'));
</script>
</body>
</html>
